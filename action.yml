# a11y-witness — drive a real screen reader over a page in CI and report what it announced.
#
# A composite action, not a Docker one: container actions do not run on Windows runners, and NVDA needs
# Windows. It must therefore be used with `runs-on: windows-2022` (or 2025).
#
# The setup steps below are not boilerplate. Each one is a fault this project already paid for, and the
# reasons are kept inline because a future reader's instinct will be to delete them.
name: a11y-witness
description: Drive NVDA over a page and report the accessibility barriers a screen-reader user would hit.
author: a11y-witness
branding:
  icon: ear
  color: purple

inputs:
  url:
    description: The page to test.
    required: true
  task:
    description: >-
      What a user is trying to DO on this page, in plain words ("Complete the checkout").

      This changes the CAPTURE: a button whose announced name shares a meaningful word with the task gets
      activated, and whatever the screen reader says next is recorded. That word match is the safety
      guard — "show only bags" activates a *Bags* button and never a *Delete account* one. Since
      `probe-forms` now defaults to true here, the task is load-bearing on a default run.

      It does NOT affect the default `local` judge's assessment. That scorer has no head for task
      completion and never sees the task; findings come from the evidence, and the report deliberately
      does not claim your task was completable. Only the `anthropic`/`openai` backends read the task and
      answer "could someone finish this?"
    required: true
  judge-backend:
    description: >-
      local | anthropic | openai. Defaults to `local`: this project's own trained scorer, which ships in
      the repo (27 KB of heads over an 87 MB encoder fetched at setup). No key, no account, no data
      leaving the runner. Twenty criteria can produce a finding, and the number that matters more on a
      REAL page is still TWELVE: the deterministic rules cover 1.1.1, 1.3.1, 1.3.5, 1.4.2, 1.4.13, 2.1.1,
      2.1.2, 2.4.1, 2.4.2, 2.4.3, 2.4.4, 2.4.7, 3.2.1, 3.2.2, 3.3.2, 3.3.3 and 4.1.2 and always run — except
      3.3.3, 3.2.1 and 3.2.2, which read OPT-IN probes that press or type, so on a page you do not own they
      cannot fire in either direction, and except 1.3.5, which has no capture evidence source at all yet
      (see criterion-coverage.ts). Seven of those twelve (2.1.1, 2.4.1, 2.4.2, 2.4.3, 2.4.7,
      3.3.2, 4.1.2) cover one failure mode of several — `criterion-coverage.ts` records which mode and
      why the rest are out. The other three (2.4.6, 3.3.1, 4.1.3) come only from the trained scorer,
      which ABSTAINS on pages unlike its training data, and those come back `cantTell` — unchecked,
      not clean.
      Use `anthropic` or `openai` for an LLM judge, which attempts any criterion — broader, noisier,
      and needs a key or an endpoint.
    required: false
    default: local
  anthropic-api-key:
    description: >-
      API key, required only when judge-backend is `anthropic`. Bring your own: this action never proxies
      your page or its transcript through anyone else's service.
    required: false
    default: ""
  judge-base-url:
    description: OpenAI-compatible endpoint, used when judge-backend is `openai` (e.g. a self-hosted model).
    required: false
    default: ""
  judge-model:
    description: Model for the judge. Defaults to the project's pinned choice.
    required: false
    default: ""
  fail-on:
    description: >-
      never | any | blocker | serious | moderate | minor. A severity means "that or worse".
      Defaults to `never`: report first, and fail the build when your team asks for it. A tool that
      breaks builds the day it is installed gets uninstalled.
    required: false
    default: never
  probe-forms:
    description: >-
      Submit forms with no valid input to hear whether errors are announced (3.3.1, 4.1.3), and activate
      the button your task names.

      ON by default here, and OFF by default in the CLI — deliberately, because the two are pointed at
      different things. Reviewing a page means checking what is ON it, and an error message nobody hears
      is only reachable by submitting. A workflow in your own repository is testing your own application,
      where submitting a form is the intended act. The CLI can be aimed at any URL on the internet, and
      pressing *Book* on somebody else's production site is not a review, so there it stays explicit.

      Set false to skip it. Note what that costs: with no activation, 3.3.1 and 4.1.3 become
      structurally unreachable rather than clean, because the evidence for them only exists after a
      control is operated.

      Two guards on what gets pressed. A submit-like name (`submit`, `sign in`, `save`, `send`, ...) is
      activated, and any other button only if its announced name shares a meaningful word with your task
      — so "show only bags" presses *Bags* and never *Delete account*.
    required: false
    default: "true"
  forms:
    description: >-
      Path to a forms config (YAML or JSON) describing the states this page's form can be put into —
      see ADR 0024 and `--emit-form-config`, which drafts one from what NVDA announced on the page.

      THIS IS THE INPUT THAT MAKES 3.3.1, 3.3.3 AND 4.1.3 REACHABLE ON A PAGE THAT REJECTS GUESSES.
      `probe-forms` submits with no valid input, which is enough for a form that validates everything and
      useless for one that will not submit until three fields are plausible. A config names the fields by
      their ACCESSIBLE NAME, gives the values, and names the control to press — so the failing state is
      the one your form actually produces rather than the one an empty submit happens to reach.

      Two states are worth declaring: an `error` state (what 3.3.1 and 3.3.3 are decided from — was the
      rejection announced, and did it say how to fix it) and a `success` state (4.1.3 — was the
      confirmation announced). Each is captured separately and reported separately.

      Unset by default. Nothing is submitted that the config does not name, and a field the config names
      that cannot be addressed by its accessible name is reported as a FINDING about the page (4.1.2)
      rather than a configuration error — a control a script cannot address by name is one a screen
      reader user cannot address either.
    required: false
    default: ""
  probe-focus:
    description: >-
      Tab through the page and report what receives focus, which is how 2.1.2 No Keyboard Trap is
      detected.

      ON by default, and in the CLI too — unlike `probe-forms`, because Tab moves focus and activates
      nothing, so it is safe on any page. 2.1.2 is one of the four NON-INTERFERENCE criteria that WCAG
      §5.2.5 applies to all content whether or not it is relied upon, and a keyboard trap is a total
      blocker: a user who cannot leave a control cannot use the rest of the page.

      Costs roughly 8 seconds per capture. Set false to skip it, and note what that costs — 2.1.2 becomes
      unreachable rather than clean, and the report says so.
    required: false
    default: "true"
  axe:
    description: >-
      Also run axe-core for the visual and rule-based criteria a screen reader cannot perceive, such as
      contrast. Set false to skip. Note that skipping means those criteria are UNCHECKED, not clean, and
      the report says so.
    required: false
    default: "true"
  comment-on-pr:
    description: Post the report as a pull-request comment, updating the previous one rather than adding another.
    required: false
    default: "true"
  node-version:
    description: Node version for the run.
    required: false
    default: "22"

outputs:
  findings:
    description: Number of lived-experience findings.
    value: ${{ steps.report.outputs.findings }}
  task-completable:
    description: Whether the judge thinks a screen-reader user could complete the stated task.
    value: ${{ steps.report.outputs.task-completable }}
  result-json:
    description: Path to the full run result, for a later step or an artifact upload.
    value: ${{ steps.capture.outputs.result-json }}

runs:
  using: composite
  steps:
    - name: Check the runner is Windows
      shell: bash
      run: |
        if [ "$RUNNER_OS" != "Windows" ]; then
          echo "::error::a11y-witness needs NVDA, which is Windows-only. Use runs-on: windows-2022." >&2
          exit 1
        fi

    - name: Check the judge is usable
      shell: bash
      run: |
        case "${{ inputs.judge-backend }}" in
          local) ;;
          anthropic)
            if [ -z "${{ inputs.anthropic-api-key }}" ]; then
              echo "::error::judge-backend: anthropic needs anthropic-api-key. Use judge-backend: local for no key." >&2
              exit 1
            fi ;;
          openai)
            if [ -z "${{ inputs.judge-base-url }}" ]; then
              echo "::error::judge-backend: openai needs judge-base-url." >&2
              exit 1
            fi ;;
          *)
            # Refuse an unknown backend rather than silently falling through to a default. A typo must not
            # quietly change which judge assessed the page.
            echo "::error::judge-backend must be local, anthropic or openai (got '${{ inputs.judge-backend }}')." >&2
            exit 1 ;;
        esac

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        # `cache: npm` WITHOUT cache-dependency-path. The path variant needs ${{ github.action_path }},
        # which is "." for a local action and makes actions/cache reject ".//package-lock.json". Bare
        # `cache: npm` caches ~/.npm only — never node_modules — so a key derived from a consumer's
        # lockfile can at worst be a cache miss, never the wrong dependencies.
        cache: npm

    # Installed into the ACTION's own checkout, not the caller's workspace: `github.action_path` is where
    # this action's package.json lives, and the caller's repository has nothing to do with it.
    #
    # Playwright's browser download is skipped to save the half a gigabyte a Windows runner does not need.
    #
    # THIS COMMENT USED TO SAY axe-core needs Playwright's API but not its bundled Chromium, AND THAT WAS
    # WRONG. `chromium.launch()` with no options needs the bundled browser specifically, so skipping the
    # download made every Action run's axe scan throw, silently, on every run -- caught by `cli.ts` and
    # reported as `ruleBased: null` while the progress line still announced the layer as running. See
    # `launchBrowser` (`packages/cli/src/scan/axe.ts`): the scan now tries the bundled browser first and
    # falls back to `channel: "msedge"`, which Windows runners DO have, and which is the same engine the
    # capture itself drives. Skipping the download is what puts every Action run on that fallback path
    # rather than an occasional one.
    - name: Install a11y-witness
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    # Cache the NVDA install (31 s). Keyed on the LOCKFILE plus the RESOLVED MANIFEST -- publish
    # blocker B4. Two things used to be conflated here: the CLIENT that drives NVDA (`@guidepup/guidepup`,
    # pinned in package-lock.json at 0.31.0) and the INSTALLER that fetches NVDA itself
    # (`@guidepup/setup`, invoked below), which was not a declared dependency at all -- `npx --yes
    # @guidepup/setup ...` fetched whatever npm currently published, on every run, unversioned and outside
    # every cache key. `@guidepup/setup` is now a pinned devDependency (see package.json), so the lockfile
    # hash below is honest about it by construction rather than by a hand-written string.
    #
    # That alone does not pin the NVDA BUILD, and it cannot: `@guidepup/setup install nvda` takes no
    # version argument (confirmed against its source -- `selectTargets` matches by screen-reader id/name
    # only) and reads no override. What it DOES read is `node_modules/@guidepup/guidepup/manifest.json`,
    # shipped inside the already-pinned client package, which names NVDA's exact resolved build under a
    # verified sha256 -- `"version": "0.2.1-2026.1.1"` at the pin this project currently carries, matching
    # the fleet's own `screenReaderVersion` exactly. So the RESOLVED build is hashed directly rather than
    # typed by hand: stronger than "tell the installer a version" would have been, because the manifest
    # IS the ground truth the installer reads, sha256 and all, not a proxy for it.
    #
    # This is the `browserVersion` memo defect's remedy applied one layer up: `bootConstant` cached Edge's
    # version on the premise that updating Edge restarts the worker, nothing made that true, and captures
    # were stamped with a version they were not taken under. A pin says what was asked for; only the
    # RUNNING INSTANCE can say what was there -- which is why the report (below) reads NVDA's version from
    # the capture, never from this key or from either package's own version number.
    #
    # The shipped scorer was trained on evidence from the fleet's NVDA, so scoring announcements from a
    # different build is a distribution shift nobody can see -- a stale cache serving last run's NVDA
    # under this run's key would corrupt evidence exactly as silently as the browserVersion memo did.
    - name: Cache the NVDA install
      id: nvda-cache
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\guidepup
        key: a11y-witness-nvda-${{ runner.os }}-${{ hashFiles('package-lock.json', 'node_modules/@guidepup/guidepup/manifest.json') }}

    # Install NVDA with the repo's OWN guidepup rather than guidepup/setup-action. The action predates
    # the @guidepup/setup 0.24.0 CLI rewrite and installs the pre-0.29 layout (registry pointer +
    # %TEMP%), which guidepup >= 0.29 does not look at -- CI fails with "NVDA is not supported", which
    # reads like a missing install and is not one. Running the installer from this checkout makes it read
    # our manifest, keeping the screen reader and the driver in lockstep.
    #
    # No `--yes`: that flag exists so npx may fetch a package it does not already have, and `@guidepup/setup`
    # is now a pinned devDependency installed by `npm ci` two steps up -- the same reason `npx tsx ...`
    # elsewhere in this file never needs it either. Its absence is the point: this must run the pinned
    # local copy or fail, never silently fetch a different one.
    - name: Set up NVDA
      shell: pwsh
      working-directory: ${{ github.action_path }}
      run: |
        npx @guidepup/setup setup
        npx @guidepup/setup install nvda

    # Guidepup ships NVDA's Speech Viewer ON, and its focus event lands in the speech-log delta captured
    # after activating a control -- so an interaction probe records "NVDA Speech Viewer" instead of the
    # page's actual response. Worse, a check that only asserts the probe FIRED still passes. Off before
    # capturing.
    - name: Disable the NVDA Speech Viewer
      shell: pwsh
      run: |
        $cacheRoot = if ($env:GUIDEPUP_SCREEN_READERS_PATH) { $env:GUIDEPUP_SCREEN_READERS_PATH }
                     else { Join-Path $env:LOCALAPPDATA 'guidepup' }
        $inis = Get-ChildItem (Join-Path $cacheRoot 'nvda') -Recurse -Filter 'nvda.ini' -ErrorAction SilentlyContinue
        if (-not $inis) { throw "No NVDA config found under $cacheRoot - the install step failed." }
        foreach ($ini in $inis) {
          $body = Get-Content $ini.FullName -Raw
          Set-Content -Path $ini.FullName -NoNewline `
            -Value ($body -replace 'showSpeechViewerAtStartup = True', 'showSpeechViewerAtStartup = False')
        }
        if ($inis | Select-String 'showSpeechViewerAtStartup = True') { throw 'Speech Viewer still enabled.' }

    # A fresh Edge profile shows a first-run welcome/sign-in surface. On a page with no elements of a
    # type, NVDA's quick-nav escapes the document into that browser UI and pollutes the transcript with
    # phantom findings about Microsoft's own chrome.
    - name: Suppress Edge's first-run experience
      shell: pwsh
      run: |
        $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge"
        New-Item -Path $key -Force | Out-Null
        Set-ItemProperty -Path $key -Name "HideFirstRunExperience" -Value 1 -Type DWord
        Set-ItemProperty -Path $key -Name "BrowserSignin" -Value 0 -Type DWord

    # Cache the pip wheels. torch USED to be here — a 400 MB download measured at 102 s, 34% of a cold
    # run, to compute a frozen 6-layer MiniLM and fourteen dot products. It is gone: inference runs the
    # encoder under ONNX Runtime (~14 MB) and does its arithmetic in numpy, so nothing on this path needs
    # autograd. torch remains a TRAINING dependency, and training never runs in CI.
    #
    # The swap was proven, not assumed. HuggingFace ships the ONNX build of the same model in the same
    # repository the encoder is already fetched from; against the safetensors model on real corpus text it
    # differs by 2.300e-07 max absolute and 0.999999881 minimum per-row cosine. End to end the eval is
    # unchanged in outcome — recall 59%, 0 false positives — and per-criterion scores move by at most
    # 1.1e-08, which is float32 noise.
    #
    # THIS USED TO SAY "Keyed on the pinned set, so a stale cache cannot serve a different runtime than
    # the one asked for" -- WITH NO PINNED SET BEHIND IT: the key named the four package NAMES and
    # nothing else, and `pip install onnxruntime transformers safetensors numpy` (no version at all)
    # meant which runtime a consumer scored against was decided by whenever this cache was first
    # populated. A comment naming the exact protection it does not provide is the `browserVersion` memo
    # defect (CLAUDE.md), arriving in the one artifact strangers actually run. Publish blocker B2.
    #
    # HASHES `packages/scorer/requirements.txt` -- the same move as B4's NVDA manifest hash, and for the
    # same reason: a file is stronger than a string copied out of it, and needs no maintenance when the
    # pin changes. That file is now EXACT versions rather than ranges (see its own header): a range meant
    # the lab's own installed versions were whatever pip resolved on the day that box was last built,
    # silently different on its next reinstall, so "pin the Action to the lab" had no fixed target to
    # pin to. Now it does, and the install step below reads its four package pins FROM that file rather
    # than repeating them, so this key and that install can never separately drift from it.
    - name: Cache the scorer's Python wheels
      if: ${{ inputs.judge-backend == 'local' }}
      uses: actions/cache@v4
      with:
        path: ~\AppData\Local\pip\Cache
        key: a11y-witness-pip-${{ runner.os }}-${{ hashFiles('packages/scorer/requirements.txt') }}

    # NO encoder cache (87 MB), and no npm cache (18 s). Both needed `${{ github.action_path }}` in a
    # path, and that is "." when the action is used locally (`uses: ./`) — actions/cache then rejects
    # ".//..." with "Relative pathing '.' and '..' is not allowed" and the action dies in 6 s. The two
    # caches that remain use HOME-relative paths, which is why they work, and they are 133 s of the 151 s.
    # Caching the encoder needs it downloaded somewhere home-relative first.

    - name: Set up the local scorer
      if: ${{ inputs.judge-backend == 'local' }}
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        python -m pip install --quiet --upgrade pip
        # EXACT versions, READ from packages/scorer/requirements.txt rather than copied by hand -- so this
        # line and the cache key above can never separately drift from what that file pins. torch and
        # huggingface-hub stay OUT on purpose: torch is a training-only dependency this Action never
        # installs (see the comment above), and huggingface-hub is not independently pinnable at this
        # layer (it rides in as a transitive of transformers).
        pins=$(grep -E '^(onnxruntime|transformers|safetensors|numpy)==' packages/scorer/requirements.txt)
        count=$(echo "$pins" | grep -c .)
        if [ "$count" -ne 4 ]; then
          echo "::error::expected 4 pinned packages (onnxruntime, transformers, safetensors, numpy) in " \
            "packages/scorer/requirements.txt, found $count: $pins" >&2
          exit 1
        fi
        python -m pip install --quiet $pins
        python packages/scorer/python/fetch-encoder.py
        # Fail here rather than at judging time: a missing model must not read as "this page is clean".
        test -f packages/scorer/models/screenreader-scorer/model.safetensors \
          || { echo "::error::The trained scorer is missing from the action checkout." >&2; exit 1; }

    # ForegroundLockTimeout = 0, or /health.ready NEVER becomes true and this action cannot work.
    #
    # `ready` gates on the ENVIRONMENT — is there a browser, can it take the foreground, are we free —
    # and a non-zero foreground lock means Windows refuses to let Edge be forced forward, so NVDA has
    # nothing to read. The VM provisioning has always applied this; the action never did, so every run
    # burned the full 180 s poll and threw "The capture worker never became ready" while the worker's own
    # log said "NVDA is up and answering; the worker is ready". The worker was right.
    #
    # Nothing caught it because nothing had ever run this action: capture-regression.yml re-implements the
    # setup by hand and calls the harness directly, so the copy a consumer's first run uses was untested.
    #
    # A registry write alone is not enough — the value is cached per session and Windows does not reliably
    # consume it at logon either. The script uses SystemParametersInfo, which is the supported live route,
    # and must run in the interactive session, which a composite action step does.
    - name: Allow Edge to be forced into the foreground
      shell: pwsh
      working-directory: ${{ github.action_path }}
      run: |
        ./packages/worker-fleet/src/provisioning/apply-foreground-lock-timeout.ps1
        $v = (Get-ItemProperty 'HKCU:\Control Panel\Desktop' -Name ForegroundLockTimeout -ErrorAction SilentlyContinue).ForegroundLockTimeout
        if ($v -ne 0) { throw "ForegroundLockTimeout is '$v', not 0 - the capture would return 0 phrases with no error." }
        Write-Host "ForegroundLockTimeout = 0"

    # The capture runs through the worker rather than in-process, because that is the path the project
    # tests: `capture:check`, `evidence:check` and the whole dataset pipeline all drive it over HTTP.
    # Worker AND capture in ONE step, deliberately. The runner kills a step's process tree at the step
    # boundary, so a worker started in its own step cannot be used by the next one — measured twice:
    # "worker ready" then ECONNREFUSED 127.0.0.1:8765 six seconds later, and again after switching from
    # -NoNewWindow to -WindowStyle Hidden, which proved it is the step boundary and not the console. An
    # explicit survival check inside the starting step even passed, then it died anyway. Rather than keep
    # fighting the runner's process management, the worker now only has to live for one step.
    #
    # Still over HTTP rather than in-process: that is the path `capture:check`, `evidence:check` and the
    # whole dataset pipeline drive, so it is the path that is actually tested.
    - name: Capture and judge
      id: capture
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        A11Y_WORKER: http://127.0.0.1:8765
        JUDGE_BACKEND: ${{ inputs.judge-backend }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        JUDGE_MODEL: ${{ inputs.judge-model }}
        JUDGE_BASE_URL: ${{ inputs.judge-base-url }}
        # Windows runners have no venv here; the packages above went to the system interpreter.
        A11Y_PYTHON: python
      run: |
        set -o pipefail
        node packages/nvda-worker/src/server.mjs \
          > "$RUNNER_TEMP/worker.log" 2> "$RUNNER_TEMP/worker.err" &
        worker=$!
        trap 'kill $worker 2>/dev/null || true' EXIT

        # Poll for READY, never sleep a guess. `ok` only means the HTTP server is answering — a worker
        # answered it once while NVDA could not start, which is how the pool's dominant failure hid for a
        # day. `ready` is the environment check, and it is false-then-true on a cold start by design.
        ready=""
        for _ in $(seq 1 360); do
          health=$(curl -fsS --max-time 5 http://127.0.0.1:8765/health 2>/dev/null || true)
          case "$health" in *'"ready":true'*) ready=1; break ;; esac
          sleep 0.5
        done
        if [ -z "$ready" ]; then
          echo "--- worker stdout ---"; cat "$RUNNER_TEMP/worker.log" 2>/dev/null || true
          echo "--- worker stderr ---"; cat "$RUNNER_TEMP/worker.err" 2>/dev/null || true
          echo "::error::The capture worker never became ready. Last /health: $health" >&2
          exit 1
        fi
        echo "worker ready"

        out="$RUNNER_TEMP/a11y-witness-result.json"
        args=("${{ inputs.url }}" --task "${{ inputs.task }}" --json)
        [ "${{ inputs.probe-forms }}" = "true" ] && args+=(--probe-forms)
        # A DECLARED config, and it is separate from `probe-forms` rather than replacing it. The
        # configured pass fills every field the config names and then presses the control it names, and
        # `capture-core` makes it REPLACE the opportunistic probe for that capture rather than run beside
        # it — pressing submit part-way through filling would attribute the evidence to a state that never
        # existed. So both inputs can be set and the config wins where it applies.
        #
        # `-n` rather than a `!= ""` comparison: the default is the empty string, and an unset input and
        # an empty one must behave the same way.
        [ -n "${{ inputs.forms }}" ] && args+=(--forms "${{ inputs.forms }}")
        # Inverted, because the CLI defaults this ON: only an explicit false turns it off. Tab activates
        # nothing, so unlike probe-forms there is no reason to make a consumer opt in to it.
        [ "${{ inputs.probe-focus }}" = "false" ] && args+=(--no-probe-focus)
        [ "${{ inputs.axe }}" = "true" ] || args+=(--no-axe)
        # stdout is the JSON result; the CLI's diagnostics go to stderr and stay in the log.
        npx tsx packages/cli/src/cli.ts "${args[@]}" > "$out"
        echo "result-json=$out" >> "$GITHUB_OUTPUT"

    - name: Report
      id: report
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        # `|| status=$?`, not `; status=$?`. GitHub runs `shell: bash` with `-eo pipefail`, so a bare
        # failing command aborts the step immediately and the lines below never run — the outputs would
        # be missing on exactly the runs where someone needs them. Verified both ways before relying on
        # it: `false; status=$?` exits 1 without reaching the next line, `false || status=$?` continues.
        status=0
        npx tsx packages/cli/src/action/run.ts \
          --result="${{ steps.capture.outputs.result-json }}" \
          --fail-on="${{ inputs.fail-on }}" \
          --summary-out="$RUNNER_TEMP/a11y-witness-summary.md" \
          --marker=a11y-witness || status=$?
        # Outputs are set BEFORE propagating the failure, so a failing check still exposes its numbers to
        # later steps. Reading them from the result rather than re-deriving keeps one source of truth.
        node -e '
          const r = require(process.argv[1]);
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `findings=${r.verdict.findings.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `task-completable=${r.verdict.taskCompletable}\n`);
        ' "${{ steps.capture.outputs.result-json }}"
        exit $status

    # Last, and `always()`, so the report still lands when the check is failing -- which is exactly when
    # someone wants to read it. `--edit-last --create-if-none` updates the previous comment instead of
    # adding one per push; the marker in the body makes it identifiable.
    - name: Comment on the pull request
      if: ${{ always() && inputs.comment-on-pr == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh pr comment "${{ github.event.pull_request.number }}" \
          --body-file "$RUNNER_TEMP/a11y-witness-summary.md" \
          --edit-last --create-if-none \
          --repo "${{ github.repository }}" \
          || echo "::warning::Could not post the PR comment. The job summary still has the report."

# GENERATED by `node scripts/run.mjs consumer-gate` from README.md's own Quickstart fence.
# Do not edit by hand -- packages/lab/src/packaging/consumer-gate.test.ts checks this file against
# the document it was generated from. See scripts/generate-consumer-gate.mjs's own header for why.
#
# #494: a CONSUMER-shaped gate. Unlike action-smoke.yml (uses: ./, repo knowledge, no checkout
# needed), this workspace starts EMPTY -- no actions/checkout of a11y-witness itself -- and its steps
# are exactly what README.md tells a reader to write, values substituted for a real target only.
# If the documented workflow is missing something a real run needs, this fails for the identical
# reason a reader's own copy would.
name: consumer-gate

on:
  workflow_call:
  workflow_dispatch:

jobs:
  check-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a pin that is not an ancestor of the commit this run is executing at
        run: |
          if ! git merge-base --is-ancestor afe42405c4355491c6aed0b416d1f91907690efb "${{ github.sha }}"; then
            echo "::error::consumer-gate.yml's uses: step is pinned to afe42405c4355491c6aed0b416d1f91907690efb, which is not an"
            echo "::error::ancestor of the commit this run is executing at, ${{ github.sha }} (ref"
            echo "::error::${{ github.ref_name }}, ${{ github.event_name }}) -- regenerate (node"
            echo "::error::scripts/generate-consumer-gate.mjs) against a commit in this history"
            exit 1
          fi
      - name: Refuse a pin that predates a change to what it pins
        run: |
          changed=$(git diff --name-only --no-renames afe42405c4355491c6aed0b416d1f91907690efb "${{ github.sha }}" -- README.md scripts/generate-consumer-gate.mjs)
          if [ -n "$changed" ]; then
            echo "::error::consumer-gate.yml is pinned to afe42405c4355491c6aed0b416d1f91907690efb, but this changed since:"
            echo "::error::$changed"
            echo "::error::regenerate (node scripts/generate-consumer-gate.mjs) and dispatch again"
            exit 1
          fi

  a11y:
    needs: [check-pin]
    runs-on: windows-2022          # NVDA needs Windows; GitHub hosts these
    timeout-minutes: 20           # a run that will not finish says so here, not after GitHub's own default
    permissions:
      contents: read
      pull-requests: write         # for the PR comment below; omit it and the report still runs, only quieter
    steps:
      - uses: actions/checkout@v4
      - uses: DanBeckDev/a11y-witness@afe42405c4355491c6aed0b416d1f91907690efb
        # Pin it: @main moves under you. Use the full commit SHA if your CI must not change.
        id: a11ign
        with:
          url: https://www.w3.org/WAI/demos/bad/before/home.html
          task: Find the main navigation and reach the survey.
      # Keep the evidence: the full result, including the transcript behind every finding. Guarded on the
      # output existing, so a run that failed does not also fail the upload.
      - uses: actions/upload-artifact@v4
        if: always() && steps.a11ign.outputs.result-json != ''
        with:
          name: a11ign-result
          path: ${{ steps.a11ign.outputs.result-json }}
          if-no-files-found: warn

  verify-report:
    needs: [a11y]
    runs-on: ubuntu-latest
    steps:
      - name: A report must exist -- refuse rather than pass on absence
        run: |
          if [ "${{ needs.a11y.result }}" != "success" ]; then
            echo "::error::the documented workflow's own job did not succeed (${{ needs.a11y.result }}) --"
            echo "::error::a reader following only README.md would have hit exactly this"
            exit 1
          fi

name: close-rows

# CLOSE THE ROWS A MERGED PR DECLARED -- pipeline unit 1d, #298.
#
# `Closes #N` is the tracker's whole closing mechanism under the pipeline, and GitHub does not apply it
# when the merge is performed by `github-actions[bot]`. Measured 2026-09-07, AFTER `issues: write` was
# added to `auto-arm.yml`: three of three bot merges left their rows open (#310, #321, #344) while two of
# two human merges closed theirs (#326, #331). The permission was never the lever.
#
# ## Why `pull_request: [closed]` and not `push: main`
#
# A push-to-main trigger is allowlisted here to watchdogs only (`push-trigger-allowlist.test.ts`), and
# correctly: the chairman's rule is that a check gating code runs on the PR, before the merge. This is not
# a gate -- it acts AFTER a merge by construction -- but it does not need `push` either. The
# `pull_request` closed event carries exactly what is needed, scoped to one PR, with GitHub's own
# `closingIssuesReferences` already resolved. No allowlist entry required, and no commit-range parsing.
#
# ## Why it cannot close a row whose work did not land
#
# Three gates, and they are the answer to `close-merged-rows.mjs`'s deliberate refusal to close anything:
# `merged == true` (a closed-unmerged PR closes nothing), `base.ref == 'main'` (a PR into another branch
# closes nothing), and the set is GitHub's OWN resolution rather than a regex over the body -- a `#123`
# mentioned in prose is not a closing reference and is not touched. Every closure comments the PR number
# and the merge sha, so the sentence that script asks for is on the row and `git show <sha>` settles what
# actually landed.
on:
  pull_request:
    types: [closed]
  # #394: `close-rows.yml` fires for SOME merges and not others, and the mechanism swallowing it is
  # unknown -- measured 2026-09-07, two PRs met every condition this workflow needs and no run of it
  # exists for either. Before this, the only way to find that out was waiting for another merge to
  # coincide with the conditions. `workflow_dispatch` converts "did it fire" from something observed by
  # luck into something that can be ASKED, against one named PR, on demand:
  #
  #   gh workflow run close-rows.yml -f pr=<n>
  #
  # `scripts/close-rows-for-merged-pr.mjs` already takes the PR number positionally -- this is a trigger
  # and an input, not new logic.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to close the rows for (must already be merged into main)"
        required: true

# `issues: write` to close them; `pull-requests: read` to resolve the references. Nothing else -- this
# workflow never writes code and must never be able to.
permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  close:
    # `workflow_dispatch` has no `pull_request` payload to gate on -- its own `pr` input is the ask, and
    # `close-rows-for-merged-pr.mjs` itself now refuses an unmerged PR or a non-`main` base (#394), so a
    # manual run cannot bypass either guarantee the `pull_request` path's own `if:` used to be the only
    # place enforcing.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Close the rows this PR declared, naming the merge sha on each
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/close-rows-for-merged-pr.mjs "${{ github.event.inputs.pr || github.event.pull_request.number }}"

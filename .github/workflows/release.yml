# The publish path. IT PUBLISHES NOTHING TODAY, AND CANNOT BE TRIGGERED BY ACCIDENT.
#
# The name is undecided (PLAN.md, B5) and nothing has been pushed to any registry. This workflow exists so
# that when the name is settled, releasing is a reviewed config change rather than someone improvising
# `npm publish` across six interdependent packages at the moment they are least able to check the result.
# npm versions cannot be unpublished after 72 hours, only deprecated, so a wrong first release is permanent.
#
# FIVE INDEPENDENT THINGS must all be true before a single byte is published. They are independent on
# purpose: any one of them alone would be a single point of failure, and this repo's own rule is that a
# verification must not share a failure mode with the action it guards.
#
#   1. `workflow_dispatch` only. There is no push, tag or schedule trigger, so nothing can start it.
#   2. `dry-run` defaults to true. The default path builds, versions and PACKS, and stops.
#   3. `confirm` must be typed exactly. A dropdown or a boolean can be clicked by mistake.
#   4. `.changeset/config.json` must say `"access": "public"`. It currently says `restricted`, so even a
#      correctly-confirmed real run fails at the publish step rather than publishing privately under a
#      name we may not keep.
#   5. `action-smoke` must have SUCCEEDED for this exact commit. That workflow drives the published Action
#      the way a consumer does — `uses: ./`, inputs only, no repo knowledge — so it is the only check here
#      that exercises the weights through the path a user takes. It already runs on every push touching
#      `packages/scorer/**`, which is where the weights live; what was missing is that nothing REQUIRED
#      it. Two workflows both passing is not the same as one gating the other, and a publish could be
#      dispatched while the consumer path was red or had never run for that commit.
#
# Removing any of the five is a deliberate act. Do not remove them in the same change that first uses this.
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, version and pack — publish nothing. Leave true unless you are releasing.
        type: boolean
        default: true
      confirm:
        description: 'To publish for real, type: publish-for-real'
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # REQUIRED BY PROVENANCE, and only by it. npm signs the attestation with a short-lived OIDC token
      # from this job; without the claim it fails the publish rather than shipping unsigned. Scoped to
      # exactly this and nothing else -- `contents` stays read, so the job still cannot push.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: https://registry.npmjs.org }

      - run: npm ci

      # The full gate, not a subset. `release:gate` is ordered cheapest-first so a cheap failure does not
      # wait behind an expensive one, and it starts with `scorer:shortcuts` — the one check that can see a
      # head penalising a feature it was never shown.
      #
      # NOT `continue-on-error`. A release that ships past its own gate is the thing this file exists to
      # prevent; if the gate cannot run in CI, fix the gate rather than skipping it here.
      #
      # SO IT WAS FIXED, BY SPLITTING IT -- 2026-08-30, on this workflow's first ever dry run, which died
      # `sh: 1: .venv/bin/python: not found` at stage 4 of 12. Seven of the twelve stages need the Python
      # venv or the CORPUS, and the corpus is gitignored and hours of fleet time: `scorer:shortcuts`,
      # `corpus:distribution`, `check-signals`, `rules:gate`, `rules:coverage`, `rules:real-pages`,
      # `evaluate-acceptance:shipped` and `eval:gate`. No amount of runner setup makes them possible, so
      # `npm run release:gate` here could only ever fail -- and a gate that cannot pass is one people stop
      # dispatching, which is how this file's own five locks would come to be bypassed.
      #
      # `release:gate:ci` is the part a runner CAN prove: the artefact is safetensors, the weights have a
      # changelog entry accounting for them, no schema migration is open, and every package is usable when
      # installed from a tarball. The rest must have passed ON THE LAB, and that is asserted by the human
      # who types `publish-for-real` rather than pretended to here.
      #
      # This is the same argument the consumer-path check below already makes for `action-smoke`: "a
      # verification sharing a failure mode with the action it guards" verifies nothing, and re-running a
      # check on the machine that wants to publish is not evidence. The difference is only that a lab job
      # leaves no artefact this workflow can query, so it says so instead of implying otherwise.
      - name: The release gate — the part a runner can prove
        run: npm run release:gate:ci

      - name: Name what this runner did NOT check
        run: |
          echo "::warning::release:gate:ci ran 4 of release:gate's 12 stages. The other 8 need the Python"
          echo "::warning::venv or the corpus and cannot run on a runner. Run them on the lab BEFORE"
          echo "::warning::publishing for real:  npm run lab:job -- -e job=release-gate"

      # BEFORE `version`, and the order is the whole point. `changeset status` reports what is PENDING, so
      # after `version` has consumed them it says "Some packages have been changed but no changesets were
      # found" and exits 1 — which is correct behaviour for a question asked at the wrong moment. Measured
      # 2026-08-30 on this workflow's second ever dry run, where it failed the step it was meant to
      # illustrate.
      - name: What is pending, before anything is applied
        run: npx changeset status

      # `changeset version` does NOT update package-lock.json under npm workspaces. Without the install
      # that follows, the lockfile ships describing the PREVIOUS versions — invisible until a consumer's
      # clean install resolves the wrong tree. `npm run release:version` does both; see .changeset/README.md.
      - name: Apply the pending changesets
        run: npm run release:version

      # AFTER, and it asks a different question: what did `version` actually write? The two together are
      # "what was asked for" and "what happened", which is the shape every verification here takes.
      - name: What the version bump actually changed
        run: git --no-pager diff --stat

      # PACK, not publish. This is the last step on the default path and it is the one that would have
      # caught the failures M0 found: `npm pack` includes untracked files, so "it worked locally" was never
      # evidence, and a package with no `prepack` ships an empty `dist` on any machine that has not built.
      - name: Pack every package, which is what a consumer receives
        run: npm run gate:isolation

      - name: The consumer path must have passed for THIS commit
        # THE CANARY, and it is a query rather than a new run on purpose.
        #
        # `action-smoke` already drives the Action as a consumer does and already triggers on any push
        # under `packages/scorer/**`. Re-running it here would be a second execution of the same thing, on
        # the same machine that wants to publish — a verification sharing a failure mode with the action
        # it guards, which is the rule this file's header already states four times over. Asking whether
        # it passed is independent; running it again is not.
        #
        # Fails closed, and in DRY RUN too. A dry run exists to tell you whether the real one would work,
        # so passing here while the consumer path is red would be the one lie this workflow must not tell.
        env:
          GH_TOKEN: ${{ github.token }}
        #
        # `smoke_status`, not `status`: prefixed because a bare `status` is READ-ONLY in zsh, and while
        # this step runs under bash, the second reserved-name collision of the day is enough to stop
        # relying on the shell being the one I expect. (`$pid` in the worker's PowerShell was the first,
        # and that one would have thrown only when a dialog appeared.)
        #
        # THREE ANSWERS, NEVER TWO. `conclusion` is EMPTY while a run is in progress, so reading it alone
        # cannot tell "never ran" from "running right now" -- and the first version told you to start a
        # run in both cases. Measured 2026-09-01 on this workflow's own dry run: action-smoke was in
        # flight, the guard reported `got: ` and advised `gh workflow run action-smoke.yml`, which would
        # have queued a second Windows job to answer a question already being answered.
        #
        # That is this repo's most expensive recurring shape, in a publish guard: the same distinction
        # `/capture/<id>` draws between 404 (never heard of it -- re-issue) and 202 (still running --
        # wait), where "producing one where the other is true" is called out as the defect that costs
        # days. Fails closed on all three, which is right; it just has to SAY which.
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          # `status` and `conclusion` together. A completed run has both; an in-flight one has a status
          # and an empty conclusion; no run at all yields neither.
          read -r smoke_status smoke_conclusion <<< "$(gh run list --workflow=action-smoke.yml --commit="$sha" \
            --json status,conclusion --jq 'first(.[] | "\(.status) \(.conclusion // "none")") // "none none"')"
          echo "action-smoke for $sha: status=$smoke_status conclusion=$smoke_conclusion"
          if [ "$smoke_conclusion" != "success" ]; then
            echo "REFUSING: the consumer path has not passed for this commit."
            echo "action-smoke drives the published Action the way a user does, so it is the only check"
            echo "here that exercises these weights through the path a consumer takes."
            if [ "$smoke_status" = "none" ]; then
              echo "It has NEVER RUN for this commit. Start it, then dispatch this workflow again:"
              echo "  gh workflow run action-smoke.yml --ref $sha"
            elif [ "$smoke_conclusion" = "none" ]; then
              echo "It is RUNNING NOW ($status). Do NOT start another — wait for it, then dispatch this"
              echo "workflow again. A second run would answer a question already being answered."
              echo "  gh run watch \$(gh run list --workflow=action-smoke.yml --commit=$sha --json databaseId --jq 'first(.[].databaseId)')"
            else
              echo "It FAILED for this commit ($smoke_conclusion). Fix the consumer path before publishing;"
              echo "re-running it unchanged would only fail again."
            fi
            exit 1
          fi

      - name: Refuse to publish unless all five guards agree
        if: inputs.dry-run == false
        run: |
          if [ "${{ inputs.confirm }}" != "publish-for-real" ]; then
            echo "::error::dry-run is false but confirm was not typed exactly. Nothing published."
            exit 1
          fi
          access=$(node -p "require('./.changeset/config.json').access")
          if [ "$access" != "public" ]; then
            echo "::error::.changeset/config.json has access=$access. Until the name is settled (PLAN.md B5)"
            echo "this is deliberately 'restricted' so an accidental release cannot claim a name. Change it"
            echo "in a reviewed commit, not here."
            exit 1
          fi

      # NPM PROVENANCE, which ADR 0006 requires and nothing implemented.
      #
      # That ADR lists it as one of "two operational requirements that are easy to forget and expensive to
      # retrofit", and gives the reason this project specifically cannot skip it: *"Provenance is worth more
      # here than usual: the whole product claim is trustworthy evidence, and a supply-chain story that
      # stops at 'trust us' undercuts it."* A tool that asks people to believe its findings about their
      # site, shipping tarballs nobody can trace to this repo, is arguing against itself.
      #
      # `NPM_CONFIG_PROVENANCE` rather than a `--provenance` flag, because changesets runs `npm publish`
      # itself across six interdependent packages and there is no argv to pass through. It needs
      # `id-token: write` on the job, added above -- without it npm fails the publish rather than quietly
      # omitting the attestation, which is the right way round.
      #
      # RETROFITTING IS THE EXPENSIVE PART, exactly as the ADR says: provenance attaches at publish time,
      # so a version shipped without it can never gain it. The first publish is the only chance.
      - name: Publish
        if: inputs.dry-run == false && inputs.confirm == 'publish-for-real'
        run: npx changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Say plainly what happened
        run: |
          if [ "${{ inputs.dry-run }}" = "false" ] && [ "${{ inputs.confirm }}" = "publish-for-real" ]; then
            echo "Published. npm versions cannot be unpublished after 72 hours, only deprecated."
          else
            echo "DRY RUN — versioned and packed, published nothing. This is the default and correct path"
            echo "until PLAN.md B5 (the name) is settled."
          fi

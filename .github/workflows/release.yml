# The publish path. IT PUBLISHES NOTHING TODAY, AND CANNOT BE TRIGGERED BY ACCIDENT.
#
# The name is undecided (PLAN.md, B5) and nothing has been pushed to any registry. This workflow exists so
# that when the name is settled, releasing is a reviewed config change rather than someone improvising
# `npm publish` across six interdependent packages at the moment they are least able to check the result.
# npm versions cannot be unpublished after 72 hours, only deprecated, so a wrong first release is permanent.
#
# SEVEN INDEPENDENT THINGS must all be true before a single byte is published. They are independent on
# purpose: any one of them alone would be a single point of failure, and this repo's own rule is that a
# verification must not share a failure mode with the action it guards.
#
#   1. `workflow_dispatch` only. There is no push, tag or schedule trigger, so nothing can start it.
#   2. `dry-run` defaults to true. The default path builds, versions and PACKS, and stops.
#   3. `confirm` must be typed exactly. A dropdown or a boolean can be clicked by mistake.
#   4. `.changeset/config.json` must say `"access": "public"`. It currently says `restricted`, so even a
#      correctly-confirmed real run fails at the publish step rather than publishing privately under a
#      name we may not keep.
#   5. `action-smoke` must SUCCEED, run HERE, against the exact sha this workflow was dispatched at. It
#      drives the published Action the way a consumer does — `uses: ./`, inputs only, no repo knowledge —
#      so it is the only check here that exercises the weights through the path a user takes.
#   6. `capture-regression` must SUCCEED, run HERE, against the same sha. It drives real NVDA over the
#      bundled tutorial pages, so a change to the capture path is proven against the exact commit about to
#      publish rather than trusted from whenever it last happened to run.
#   7. `consumer-gate` must SUCCEED, run HERE. #494: `action-smoke` runs `uses: ./` with full repository
#      knowledge — it needs no `actions/checkout` and never reads the public documents, so it could not
#      have caught (and did not catch) three publish-blockers the V1 rehearsal (#324) found on a real
#      windows-2022 runner: no checkout in any public doc, the Action's own build dying on Windows, and a
#      failure message lying about where the report was. `consumer-gate.yml` is generated from README.md's
#      own Quickstart fence, not hand-retyped, and its workspace starts empty — the ONE check here that
#      exercises the path a first reader actually takes, rather than the path this repo's own CI takes.
#
#   5, 6 and 7 used to run on every push touching their own paths, on `main`, with this workflow merely
#   QUERYING whether that separately-triggered run had passed — reasonable while `main` itself was gated
#   by nothing else, wrong now that `ci.yml` gates every merge on the PR (chairman's direction,
#   2026-09-06): a check that only ever ran on a push nobody blocks on is not a release guard, it is a
#   a habit. All three workflows left `main`/PR entirely and now declare `workflow_call`, so this file runs
#   them as JOBS against the sha actually being released, and `release`'s own `needs:` on all three makes
#   "job did not succeed" the same failure as any other step here — no query, no race between "never ran"
#   and "running right now", the exact ambiguity the old query step had to fail closed on three ways.
#
# Removing any of the seven is a deliberate act. Do not remove them in the same change that first uses this.
#
# `dist-tag` (issue #326) IS NOT AN EIGHTH GUARD -- it is a CHANNEL, orthogonal to all seven. All of them
# still gate the run identically whether `dist-tag` is empty (publishes "latest", today's only behaviour)
# or set (publishes under a named tag instead). It exists so the real path -- dry-run false, confirm typed,
# access public, both smoke jobs green -- can be rehearsed against `next` without a first user's plain
# `npm install` ever resolving to it, which `latest` would.
name: release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build, version and pack — publish nothing. Leave true unless you are releasing.
        type: boolean
        default: true
      confirm:
        description: 'To publish for real, type: publish-for-real'
        type: string
        default: ''
      dist-tag:
        description: >-
          npm dist-tag for a real publish, e.g. "next" -- lets the real path be exercised without
          claiming "latest", which is what a first user installs. Empty publishes to "latest" as before;
          this changes WHICH TAG gets the version, none of the seven guards above.
        type: string
        default: ''

jobs:
  # GUARDS 5, 6 AND 7, RUN AS JOBS AGAINST THE EXACT SHA THIS WORKFLOW WAS DISPATCHED AT -- see the file
  # header. `uses:` a local workflow path calls it as a reusable workflow (`workflow_call`); no `with:`
  # needed, since neither takes an input. GitHub runs a called workflow at THIS workflow's own ref by
  # default, which is exactly the property the old query step existed to approximate by asking whether a
  # separately-triggered run happened to match.
  action-smoke:
    uses: ./.github/workflows/action-smoke.yml

  capture-regression:
    uses: ./.github/workflows/capture-regression.yml

  # #494. `consumer-gate.yml`'s own `uses: a11ign/a11ign@<sha>` step is pinned to a LITERAL sha
  # baked in at generation time (see scripts/generate-consumer-gate.mjs's own header for why `${{ }}` does
  # not work in a `uses:` field) -- so unlike action-smoke/capture-regression, this job does NOT
  # automatically track "the exact sha this workflow was dispatched at" by virtue of being a local
  # `workflow_call`. #558 closes that gap FROM INSIDE consumer-gate.yml itself: it now carries its own
  # `check-pin` job comparing the pin against `${{ github.sha }}`, which under `workflow_call` resolves to
  # THIS release's own dispatched sha -- so a stale pin fails here, on ubuntu-latest, before the Windows
  # job ever starts, with no separate step needed. The "consumer-gate.yml is current" step in the
  # `release` job below still checks something DIFFERENT: real drift between README.md's documented
  # workflow and the committed file (a reworded doc, a generator change) -- regenerate (`node
  # scripts/generate-consumer-gate.mjs`) and commit if that one fires.
  consumer-gate:
    uses: ./.github/workflows/consumer-gate.yml
    # #1251. A called workflow may not request more than its caller grants, and this repository's default
    # GITHUB_TOKEN is read-only. consumer-gate.yml is generated from README.md's Quickstart fence, which on
    # 2026-09-09 gained `pull-requests: write` for the Action's optional PR-comment step -- so from that day
    # every dispatch of THIS file failed at validation ("The nested job 'a11y' is requesting
    # 'pull-requests: write', but is only allowed 'pull-requests: none'"), before a single job existed, and
    # nothing on the PR path could see it because nothing on the PR path calls release.yml. The grant
    # lives HERE, not in the generator: the generated file must stay exactly what a reader copies.
    # `release-safety.test.ts` pins that every permission a called job requests is granted on its caller.
    permissions:
      contents: read
      pull-requests: write

  release:
    needs: [action-smoke, capture-regression, consumer-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # REQUIRED BY PROVENANCE, and only by it. npm signs the attestation with a short-lived OIDC token
      # from this job; without the claim it fails the publish rather than shipping unsigned. Scoped to
      # exactly this and nothing else -- `contents` stays read, so the job still cannot push.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # #1452: `changeset status`'s divergence check (`@changesets/git`'s `getDivergedCommit`) runs
      # `git merge-base main HEAD` -- a literal LOCAL branch named `main`, never `origin/main`. Dispatched on
      # any other branch, `actions/checkout` above creates a local ref only for the branch actually checked
      # out; `main` exists solely as `origin/main`, so that lookup fails with "Failed to find where HEAD
      # diverged from main" before a single version prints (measured on run 34783509737, dispatched off
      # `agent/first-publish-0-1-0-1396`). Dispatched on `main` itself the local branch already exists --
      # forcing it here would be `git branch -f` on the branch currently checked out, which git refuses.
      - name: Make a local `main` ref available for changesets' divergence check
        run: |
          if [ "$(git symbolic-ref --short HEAD)" != "main" ]; then
            git fetch origin main:main
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, registry-url: https://registry.npmjs.org }

      - run: npm ci
      - run: npm run build

      # THE WHOLE-REPO COVERAGE THRESHOLD, HERE AND ON A NIGHTLY SCHEDULE (`nightly.yml`'s `coverage`
      # job -- moved there from the now-deleted `coverage.yml`, #901) -- chairman's direction, 2026-09-06,
      # follow-up to #133/#140. It left `ci.yml`'s per-PR job entirely (154s of a measured 269s,
      # re-testing packages a given PR could not have touched), and a release is the other place it must
      # still be checked: nothing else on the release path re-runs the full suite, so a threshold
      # regression that a package-scoped PR run could not see would otherwise ship unnoticed.
      #
      # #1308: BUT NOT TWICE FOR THE SAME SHA. `npm run coverage` is rstest (`@rstest/coverage-v8`, #1320)
      # over the whole suite, and nightly already pays that cost once a day against whatever `main`'s tip was at
      # 06:17 London -- a release cut soon after a nightly run re-runs coverage for a sha nightly already
      # verified. This step reads nightly's own `coverage` JOB conclusion (never the run's -- a sibling
      # job like `gateSweep` failing must not make this refuse a genuinely reusable verdict) for the EXACT
      # sha being released, never "the latest nightly run" (which is usually the PARENT sha, not this
      # one). No verdict for this sha, or a failed one, and it runs coverage exactly as before.
      - id: coverage-verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-reuses-verdict.mjs --sha=${{ github.sha }}

      - name: Coverage — the whole-repo threshold
        if: steps.coverage-verdict.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run coverage

      # The full gate, not a subset. `release:gate` is ordered cheapest-first so a cheap failure does not
      # wait behind an expensive one, and it starts with `scorer:shortcuts` — the one check that can see a
      # head penalising a feature it was never shown.
      #
      # NOT `continue-on-error`. A release that ships past its own gate is the thing this file exists to
      # prevent; if the gate cannot run in CI, fix the gate rather than skipping it here.
      #
      # SO IT WAS FIXED, BY SPLITTING IT -- 2026-08-30, on this workflow's first ever dry run, which died
      # `sh: 1: .venv/bin/python: not found` at stage 4 of 12. Eight of the chain's thirteen stages need
      # the Python venv or the CORPUS, and the corpus is gitignored and hours of fleet time: `scorer:shortcuts`,
      # `corpus:distribution`, `check-signals`, `rules:gate`, `rules:coverage`, `rules:real-pages`,
      # `evaluate-acceptance:shipped` and `eval:gate`. No amount of runner setup makes them possible, so
      # `npm run release:gate` here could only ever fail -- and a gate that cannot pass is one people stop
      # dispatching, which is how this file's own five locks would come to be bypassed.
      #
      # `release:gate:ci` is the part a runner CAN prove: the artefact is safetensors, the weights have a
      # changelog entry accounting for them, no schema migration is open, and every package is usable when
      # installed from a tarball. The rest must have passed ON THE LAB, and that is asserted by the human
      # who types `publish-for-real` rather than pretended to here.
      #
      # This is the same argument the consumer-path check below already makes for `action-smoke`: "a
      # verification sharing a failure mode with the action it guards" verifies nothing, and re-running a
      # check on the machine that wants to publish is not evidence. The difference is only that a lab job
      # leaves no artefact this workflow can query, so it says so instead of implying otherwise.
      - name: The release gate — the part a runner can prove
        run: npm run release:gate:ci

      # #558: THIS STEP NO LONGER VERIFIES THE PIN'S FRESHNESS -- IT CANNOT, AND NEITHER CAN ANYTHING ELSE
      # RUN AT THIS POINT. `generate-consumer-gate.mjs`'s own header explains why: a regenerated file pins
      # HEAD, but COMMITTING that file makes HEAD become a new commit the pin cannot name, so "does the pin
      # equal HEAD" has no reachable YES in any committed tree -- measured on a clean `main`, where this
      # step failed unconditionally, including on a commit that had JUST regenerated correctly. What
      # remains is real drift: does the committed file still match what README.md's documented workflow
      # produces, sha aside (a reworded doc, a generator change) -- the same comparison
      # commands-documented.test.ts already runs for docs/commands.md (A6b, #478), and the one this check
      # CAN actually pass or fail on.
      #
      # The pin's FRESHNESS is guard 7's own concern now, not this step's: `consumer-gate.yml` carries a
      # `check-pin` job (also #558) comparing the pin against `${{ github.sha }}`, which under this file's
      # `workflow_call` resolves to THIS release's own dispatched sha -- so a stale pin fails guard 7
      # itself, on ubuntu-latest, before that job's Windows step even starts. This step and guard 7 check
      # two different things and neither one alone would close the "checked something, not this" gap.
      - name: consumer-gate.yml matches README.md's documented workflow (sha aside -- guard 7 checks that)
        run: node scripts/generate-consumer-gate.mjs --check

      # #1397: THIS COUNT USED TO BE TYPED INTO THE MESSAGE ("4 of release:gate's 12 stages") rather than
      # read from the two chains it describes, and drifted the day release:gate grew a stage: the true
      # count was 5 of 13. `release-gate-scope.mjs` reads `package.json`'s own `release:gate` and
      # `release:gate:ci` scripts every run, so the warning can only ever describe the chain that exists.
      - name: Name what this runner did NOT check
        run: node scripts/release-gate-scope.mjs

      # BEFORE `version`, and the order is the whole point. `changeset status` reports what is PENDING, so
      # after `version` has consumed them it says "Some packages have been changed but no changesets were
      # found" and exits 1 — which is correct behaviour for a question asked at the wrong moment. Measured
      # 2026-08-30 on this workflow's second ever dry run, where it failed the step it was meant to
      # illustrate.
      #
      # #1466: `--verbose` is the whole fix for this step. Plain `changeset status` prints only a BUMP
      # LEVEL per package ("minor"), never a version -- every reading of "0.1.0 for all six" up to run
      # 34785498618 was arithmetic done by whoever read the log, not something the log said. `--verbose`
      # prints `<name> -> <newVersion>` for every package the release plan touches.
      - name: What is pending, before anything is applied
        run: npx changeset status --verbose

      # `changeset version` does NOT update package-lock.json under npm workspaces. Without the install
      # that follows, the lockfile ships describing the PREVIOUS versions — invisible until a consumer's
      # clean install resolves the wrong tree. `npm run release:version` does both; see .changeset/README.md.
      - name: Apply the pending changesets
        run: npm run release:version

      # #1466: AFTER `release:version`, the manifests hold the version this run would actually publish --
      # the applied half of "pending and applied" (`git diff --stat` below names which FILES changed, never
      # what they now say). `release-print-versions.mjs` reads the same six manifests
      # `manifest-repository-check.mjs` already treats as "published", so this names exactly the packages
      # the pending step above named.
      - name: What each package's version now is
        run: node scripts/release-print-versions.mjs

      # AFTER, and it asks a different question: what did `version` actually write? The two together are
      # "what was asked for" and "what happened", which is the shape every verification here takes.
      - name: What the version bump actually changed
        run: git --no-pager diff --stat

      # PACK, not publish. This is the last step on the default path and it is the one that would have
      # caught the failures M0 found: `npm pack` includes untracked files, so "it worked locally" was never
      # evidence, and a package with no `prepack` ships an empty `dist` on any machine that has not built.
      - name: Pack every package, which is what a consumer receives
        run: npm run gate:isolation

      # #1536: EVERY PUBLISHED MANIFEST MUST NAME THE REPOSITORY THIS RUN PUBLISHES FROM, and this asks before the
      # registry does. Run 34816466408 passed every guard job and every step above, then npm's provenance check
      # refused the PUT: each manifest's "repository.url" named a11ign/a11ign, not the repository the run came from
      # (#915 5660524401). NO `if:`, deliberately: a dry run never reaches the registry, so this step is the only
      # place a dry run can see the mismatch. Until the transfer (#63) a run from the pre-transfer repository goes
      # red HERE by design -- the manifests already name a11ign/a11ign -- and that is not a regression.
      - name: Every published manifest names the repository this run publishes from
        run: node scripts/manifest-repository-check.mjs

      - name: Refuse to publish unless all seven guards agree
        if: inputs.dry-run == false
        run: |
          if [ "${{ inputs.confirm }}" != "publish-for-real" ]; then
            echo "::error::dry-run is false but confirm was not typed exactly. Nothing published."
            exit 1
          fi
          access=$(node -p "require('./.changeset/config.json').access")
          if [ "$access" != "public" ]; then
            echo "::error::.changeset/config.json has access=$access. Until the name is settled (PLAN.md B5)"
            echo "this is deliberately 'restricted' so an accidental release cannot claim a name. Change it"
            echo "in a reviewed commit, not here."
            exit 1
          fi

      # NPM PROVENANCE, which ADR 0006 requires and nothing implemented.
      #
      # That ADR lists it as one of "two operational requirements that are easy to forget and expensive to
      # retrofit", and gives the reason this project specifically cannot skip it: *"Provenance is worth more
      # here than usual: the whole product claim is trustworthy evidence, and a supply-chain story that
      # stops at 'trust us' undercuts it."* A tool that asks people to believe its findings about their
      # site, shipping tarballs nobody can trace to this repo, is arguing against itself.
      #
      # `NPM_CONFIG_PROVENANCE` rather than a `--provenance` flag, because changesets runs `npm publish`
      # itself across six interdependent packages and there is no argv to pass through. It needs
      # `id-token: write` on the job, added above -- without it npm fails the publish rather than quietly
      # omitting the attestation, which is the right way round.
      #
      # RETROFITTING IS THE EXPENSIVE PART, exactly as the ADR says: provenance attaches at publish time,
      # so a version shipped without it can never gain it. The first publish is the only chance.
      - name: Publish
        if: inputs.dry-run == false && inputs.confirm == 'publish-for-real'
        # `--tag` ONLY when a dist-tag was given -- changesets' own default (no flag) is "latest", and
        # passing an empty `--tag ""` is not the same as omitting the flag, so the flag itself is built
        # conditionally rather than always passed.
        run: npx changeset publish${{ inputs.dist-tag != '' && format(' --tag {0}', inputs.dist-tag) || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Say plainly what happened
        run: |
          if [ "${{ inputs.dry-run }}" = "false" ] && [ "${{ inputs.confirm }}" = "publish-for-real" ]; then
            if [ -n "${{ inputs.dist-tag }}" ]; then
              echo "Published under dist-tag '${{ inputs.dist-tag }}' -- 'npm install <pkg>' still "
              echo "resolves to whatever 'latest' already points at; only 'npm install <pkg>@${{ inputs.dist-tag }}' reaches this."
            fi
            echo "Published. npm versions cannot be unpublished after 72 hours, only deprecated."
          else
            echo "DRY RUN — versioned and packed, published nothing. This is the default and correct path"
            echo "until PLAN.md B5 (the name) is settled."
          fi

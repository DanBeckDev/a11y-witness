name: capture-regression

# Phase 1 (ADR 0003): the capture half's regression gate. Drives the real
# capture worker (NVDA on a Windows runner via guidepup/setup-action) over the
# bundled tutorial pages and asserts the stable raw signals each should yield
# (see src/capture/nvda/capture-check.mjs). Path-filtered so it only spends
# Windows-runner minutes when capture could have regressed; also on-demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/capture/**"
      - "!src/capture/**/*.md" # doc-only edits shouldn't spend Windows minutes
      - "src/eval/pages/tutorials/**"
      - ".github/workflows/capture-regression.yml"
  pull_request:
    paths:
      - "src/capture/**"
      - "!src/capture/**/*.md"
      - "src/eval/pages/tutorials/**"
      - ".github/workflows/capture-regression.yml"

jobs:
  capture:
    runs-on: windows-2022 # Guidepup supports Windows Server 2022/2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Capture needs @guidepup/guidepup at runtime but NOT Playwright browsers.
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Install NVDA via the repo's OWN guidepup rather than guidepup/setup-action:
      # the action predates the @guidepup/setup 0.24.0 CLI rewrite and installs the
      # pre-0.29 layout (registry pointer + %TEMP%), which guidepup >=0.29 does not
      # look at — CI would fail with "NVDA is not supported". Running the installer
      # from the repo makes it read our local manifest.json, keeping the screen
      # reader and the driver in lockstep with package.json. See
      # docs/nvda-worker-runbook.md.
      - name: Set up NVDA (Guidepup)
        shell: pwsh
        run: |
          npx --yes @guidepup/setup setup
          npx --yes @guidepup/setup install nvda
      # Guidepup ships the Speech Viewer ON. Its focus event lands in the
      # spokenPhraseLog delta captured after activating a control, so every
      # interaction probe records "NVDA Speech Viewer" instead of the page's
      # response — and capture-check would still pass, because it asserts the probe
      # fired, not what it heard. Turn it off before capturing.
      - name: Disable the NVDA Speech Viewer
        shell: pwsh
        run: |
          $cacheRoot = if ($env:GUIDEPUP_SCREEN_READERS_PATH) { $env:GUIDEPUP_SCREEN_READERS_PATH }
                       else { Join-Path $env:LOCALAPPDATA 'guidepup' }
          $inis = Get-ChildItem (Join-Path $cacheRoot 'nvda') -Recurse -Filter 'nvda.ini' -ErrorAction SilentlyContinue
          if (-not $inis) { throw "No NVDA config found under $cacheRoot - the install step failed." }
          foreach ($ini in $inis) {
            $body = Get-Content $ini.FullName -Raw
            Set-Content -Path $ini.FullName -NoNewline `
              -Value ($body -replace 'showSpeechViewerAtStartup = True', 'showSpeechViewerAtStartup = False')
          }
          if ($inis | Select-String 'showSpeechViewerAtStartup = True') { throw 'Speech Viewer still enabled.' }
      # A fresh Edge profile shows a first-run welcome/sign-in surface; on a
      # page with no headings of a type, NVDA quick-nav escapes the empty
      # document into that browser UI and pollutes the capture. Suppress it via
      # the documented Edge policies (runner steps are admin).
      - name: Suppress Edge first-run experience
        shell: pwsh
        run: |
          $key = "HKLM:\SOFTWARE\Policies\Microsoft\Edge"
          New-Item -Path $key -Force | Out-Null
          Set-ItemProperty -Path $key -Name "HideFirstRunExperience" -Value 1 -Type DWord
          Set-ItemProperty -Path $key -Name "BrowserSignin" -Value 0 -Type DWord
      - name: Capture-regression checks (real NVDA)
        run: node src/capture/nvda/capture-check.mjs

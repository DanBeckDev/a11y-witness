name: Board report

# THE BOARD DOCUMENT, PUBLISHED FROM GITHUB RATHER THAN FROM A LAPTOP.
#
# It ran as a launchd job on one Mac until 2026-09-06, for a reason that was correct at the time: the
# report's merge count and push-state lines exist to catch work committed locally and never pushed, and a
# runner only ever sees `origin/main`. The chairman has since ruled that EVERYTHING IS PUSHED, so GitHub
# is the complete record -- which removes the reason and takes the schedule off a single machine nobody
# else can see, restart, or inherit.
#
# WHAT THAT RULING COSTS, stated rather than absorbed: this workflow cannot see an unpushed local branch,
# so it cannot report one. The push-state line in the edition now records the rule rather than proving it,
# and says so. The dispatcher's own branch count is what would contradict it. An absent check must not
# read as a clean one.
on:
  schedule:
    # BOTH, and the job gates on London's actual hour -- see the first step. 07:00 UTC is 08:00 London
    # under BST; 08:00 UTC is 08:00 London under GMT. Exactly one of the two acts on any given day.
    # #965: OFF THE HOUR (:13). Four consecutive days the :00 pair started ~5 h late and the edition was
    # dispatched by hand. London still reads 08 at 08:13, so the hour gate below is unchanged; the summary's
    # dateline must now be within 60 minutes of 08:13 London, i.e. written at 07:14 or later.
    - cron: "13 7 * * *"
    - cron: "13 8 * * *"
  workflow_dispatch:
    inputs:
      republish:
        description: >-
          Re-render TODAY'S edition outside the 08:00 London hour. Only permitted when today's release
          already exists -- this REPLACES a document the board has, and can never create one they should
          not have yet.
        type: boolean
        default: false

permissions:
  contents: write        # the Release draft that carries the PDF
  issues: write          # the daily edition, as a comment on the report issue

concurrency:
  # One edition per day. A re-run replaces the asset on the same draft rather than racing it.
  group: board-report
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # 08:00 LONDON, YEAR ROUND. GitHub schedules in UTC only, so a single cron is the right hour
      # for half the year and an hour out for the other half. Both are scheduled and every step below is
      # gated on London's actual clock: the stated hour is then true in summer and in winter, rather than
      # true in summer and quietly wrong from October.
      #
      # A stated time that is wrong for half the year is exactly the small untruth this pipeline refuses
      # everywhere else. The wrong-half run exits SUCCESSFULLY and says so in its log -- a failed run
      # would put a red mark on the repository every day for behaving correctly, which is how a signal
      # gets ignored.
      - id: hour
        name: Is it 08:00 in London?
        run: |
          LONDON=$(TZ=Europe/London date +%H)
          echo "london=$LONDON" >> "$GITHUB_OUTPUT"
          if [ "$LONDON" = "08" ]; then
            echo "London reads $LONDON:00 - this is the 08:00 run."
          else
            echo "London reads $LONDON:00, not 08:00 - the other half of the year's pair."
            echo "Doing nothing, successfully."
          fi

      # REPUBLISH: THE ONE WAY PAST THE HOUR GATE, AND IT CANNOT CREATE AN EDITION.
      #
      # The hour gate treats two different acts identically: replacing today's already-published document,
      # and publishing one at the wrong hour. Only the second needs preventing -- on 8 September three
      # corrections the board itself asked for could not reach the document they were for, because the
      # only path was gated on an hour that had passed.
      #
      # So this is permitted ONLY when today's release ALREADY EXISTS. That single precondition is what
      # makes it safe rather than an override: with it, the worst this can do is replace a document the
      # board already has; without it, it would be a way to publish at 03:00.
      #
      # UNREACHABLE FROM THE SCHEDULE by construction: `inputs.republish` is empty on a `schedule` event,
      # so the condition is false there whatever the hour. It is not a flag the cron can trip.
      - id: republish
        if: github.event_name == 'workflow_dispatch' && inputs.republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY=$(TZ=Europe/London date +%Y-%m-%d)
          if gh release view "board/$DAY" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "board/$DAY exists - republishing today's edition over it."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "REFUSING: board/$DAY does not exist, so this would CREATE an edition outside 08:00" >&2
            echo "London rather than replace one. Wait for the schedule." >&2
            exit 1
          fi

      - name: Check out main
        if: steps.hour.outputs.london == '08' || steps.republish.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          # THE MERGE COUNT NEEDS HISTORY. A shallow checkout makes `git log --merges --since` report
          # whatever the depth happened to include, which is a number that looks right and is not.
          fetch-depth: 0
          ref: main

      - name: Set up node
        if: steps.hour.outputs.london == '08' || steps.republish.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        if: steps.hour.outputs.london == '08' || steps.republish.outputs.ok == 'true'
        run: npm ci

      # THE SUMMARY GATES THE EDITION, exactly as it did locally. A summary assembled from the sections is
      # what the board forbade, so there is no fallback: no committed summary for today, no edition.
      - name: Publish the edition
        if: steps.hour.outputs.london == '08' || steps.republish.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/board-report.mjs --post --issue=20
          node scripts/board-document.mjs --pdf --release

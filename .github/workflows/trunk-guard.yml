name: trunk-guard

# THE MERGE COMMIT THAT LANDS ON `main` HAS NEVER ITSELF BEEN TESTED -- pipeline unit 3, #316. Unit 1
# (#298) made this real by turning branch protection's `strict` off: `ci.yml`'s `pull_request` trigger
# tests a PR's own HEAD, never the merge commit GitHub actually produces when it lands, and with
# `strict=false` nothing requires that merge commit to match a tree anyone tested before the merge
# completes. This workflow is the one place that gap is closed -- it runs the full suite against `main`'s
# real, new tip on every push, and when it fails, and ONLY when the failure is genuinely this push's own,
# opens an automatic revert. See `scripts/trunk-revert.mjs`'s own header for the two ways a bare
# "revert on red" would be worse than nothing, both measured live the morning this was built: reverting an
# INHERITED failure (13 of 19 PRs read red on one bad commit and none was at fault), and reverting a
# commit main has already moved past (a follow-up fix would be reverted instead of the fault).
#
# THIS IS DELIBERATELY NOT `ci.yml`'s `gate`, and not merely a copy of it moved to `push`. `ci.yml`'s own
# header rules a push trigger out THERE for a real reason -- "a check that runs after the merge cannot
# stop it, which is exactly what a push trigger was" -- and that reasoning is still correct for PRE-merge
# gating. This workflow is not pre-merge gating; it cannot stop a merge that already landed, and does not
# try to. It is the reactive half: verify, and where it is safe to, fix forward. See
# `push-trigger-allowlist.test.ts`'s `TRUNK_GATE_ALLOWLIST` for why this is its own closed category,
# structurally distinct from the lightweight, continue-on-error watchdogs that were the only push-to-main
# precedent before this row -- the `trunkGate`/`trunkBuildTest`/`decideRevert` chain DOES build, DOES run
# the full suite, and is NOT continue-on-error, because a red run there is exactly the signal that drives
# the revert, not something to observe and move past.
#
# THE WATCHDOGS LIVE HERE TOO, SINCE #901 (The CI Reset, step 1), AS THE SEPARATE `watchdogs` JOB BELOW.
# Until 2026-09-10 they were three workflows of their own, each firing on every push to main -- 777 runs
# on the day measured, for three scripts that each take seconds. They ask whether the board editions are
# still arriving (`board-report.yml` and `board-summary-check.yml`, watched by
# `scripts/board-schedule-liveness.mjs`), whether the first-publish NPM_TOKEN is still present (#73), and
# whether the pull request that produced this commit was actually tested (#118). Each is a property of
# TIME, and each MUST still run on push and never on a cron: GitHub disables scheduled workflows
# repository-wide after 60 days of inactivity, so a scheduled watchdog dies in the same breath as the jobs
# it guards, while a push cannot be disabled by inactivity because a push IS the activity. This workflow
# already runs on every push, so the three steps here cost no workflow runs of their own. They are
# `continue-on-error`, deliberately: each finding is about the pipeline or a secret, never about the commit
# that happened to trigger it, and failing the push would blame an unrelated author. `decideRevert` does
# not depend on this job, so a red watchdog can never drive a revert. `board-liveness.test.ts`,
# `npm-token-liveness.test.ts` and `workflow-run-liveness.test.ts` pin all of that against this file.
#
# UNSCOPED, DELIBERATELY, unlike `ci.yml`'s per-package `ts` job. A push to `main` is a merge, which by
# definition can touch anything, and pushes to `main` are far less frequent than PR commits -- there is no
# throughput pressure here that would justify the same path-scoping.
#
# KNOWN GAP, STATED RATHER THAN HIDDEN: this does not (yet) run `ci.yml`'s `ansible` syntax-check or
# `rulesFitness` (`npm run rules-check`) jobs. Both are cheap to add later; left out of the first version
# to keep this row's scope to the revert MECHANISM, which is what #316's acceptance actually exercises.
on:
  push:
    branches: [main]
  # #417: `workflow_dispatch`, so `trunk-sweep.yml` can trigger a real gate RUN against `main`'s current
  # tip when a bot merge (GITHUB_TOKEN-authored, so `push` never fires -- #394's overnight measurement)
  # left it with zero check runs. No `ref` input needed: `workflow_dispatch` with none given runs against
  # the repository's DEFAULT branch, which is `main`, so `github.sha` inside the run correctly resolves
  # to main's tip either way.
  workflow_dispatch:

jobs:
  # #394 UPDATE, 2026-09-08: A `closeRowsSweep` JOB USED TO STAND HERE, RIDING THIS WORKFLOW'S OWN
  # `push: branches: [main]` TRIGGER. IT WAS DEAD ON ARRIVAL AND HAS BEEN REMOVED.
  #
  # Measured: GitHub does not trigger workflows from events created with `GITHUB_TOKEN` -- a merge
  # completed by `github-actions[bot]` (every merge `auto-arm.yml` completes) produces a `pull_request:
  # closed` event AND a push to `main` that start NOTHING. 19 of 19 bot-merged PRs never ran `close-
  # rows.yml`; 5 of 5 sampled bot-merge SHAs never ran `trunk-guard.yml` at all -- not "ran and passed",
  # never ran. So a job riding THIS workflow's push trigger, built specifically to backstop bot merges,
  # could never fire for the one case it existed to catch: a guard that structurally cannot run for its
  # own target is worse than no guard, because it reads as coverage that was never real.
  #
  # `close-rows.yml`'s own `workflow_dispatch` (added in the same PR as the now-removed sweep) stays --
  # it is how the workflow can be exercised deliberately regardless of which identity merged. The
  # backstop this row needed is #417 (an interim scheduled sweep, gated on `main`'s tip carrying zero
  # check runs) and #416 (the permanent fix: arm with a real PAT so bot merges stop being invisible to
  # every `pull_request`/`push` trigger in this repository, not just this one).

  # THE WATCHDOGS (#901): three continue-on-error steps, one per liveness script. See the header for why
  # they are here rather than in `nightly.yml`, and why `decideRevert` must never depend on this job.
  watchdogs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write          # one comment per stale spell, on the report issue (#20) or on #73
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Was the pull request that produced this commit actually tested? (#118)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/workflow-run-liveness.mjs --sha=${{ github.sha }}
      - run: npm ci --ignore-scripts
      - name: Are the board editions still arriving? (#272, #590)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/board-schedule-liveness.mjs --post --issue=20
      - name: Is NPM_TOKEN still there? (#73)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ORG_SECRETS_READ_TOKEN || github.token }}
        run: node scripts/npm-token-liveness.mjs --post --issue=73

  # THE ONLY QUESTION THIS JOB ANSWERS: did this push silently revert work already on main. `trunkBuildTest`
  # below answers the OTHER half (is main's new tip actually green); `decideRevert` decides whether either
  # failure is this push's own, or something else.
  trunkGate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # #411: A MERGE CAN DELETE WORK ALREADY ON `main` WHILE EVERY OTHER CHECK STAYS GREEN -- see
      # trunk-revert-guard.mjs's own header for the incident and why the obvious instruments (git
      # merge-tree on the merge's two parents, GitHub's own PR file list) both fail to catch it. Pure git,
      # no build or install needed, so it runs FIRST -- a revert-worthy push fails fast rather than
      # waiting on a full suite that cannot see this class of defect at all. `fetch-depth: 0` above
      # already gives it everything it needs: the merge's own parents are both within `main`'s full
      # history, unlike a case needing another PR's unrelated branch tip.
      - name: This push did not silently revert work already on main (#411)
        run: node scripts/trunk-revert-guard.mjs --merge=${{ github.sha }}

  # A1 (#452): CALLS `reusable-build-test.yml` -- see that file's own header for why (it used to duplicate
  # `ci.yml`'s `ts`+`python` jobs independently; chairman's own comment on `ci.yml` had measured the two
  # running "the SAME suite, on every merge"). `needs: trunkGate` preserves the original fail-fast order:
  # this only runs once the revert-guard check (pure git, no build) has passed, exactly as it did when both
  # were sequential steps in one job -- a revert-worthy push still fails fast rather than paying for a full
  # suite that cannot see that class of defect at all.
  #
  # UNSCOPED + PYTHON, DELIBERATELY, unlike `ci.yml`'s per-package `ts`/`python` jobs -- a push to `main` is
  # a merge, which by definition can touch anything, and pushes to `main` are far less frequent than PR
  # commits, so there is no throughput pressure here that would justify the same path-scoping.
  trunkBuildTest:
    needs: trunkGate
    uses: ./.github/workflows/reusable-build-test.yml
    with:
      run-lint-typecheck: true
      run-ts-tests: true
      ts-test-scope: unscoped
      run-python-tests: true

  # RUNS WHEN EITHER `trunkGate` OR `trunkBuildTest` ACTUALLY FAILED -- and `always() &&` IS REQUIRED, not
  # decorative. This section used to say the opposite ("never `always()`"), and that claim was WRONG in a
  # way that meant this job had never fired once: an `if:` with no status-check function carries an
  # IMPLICIT `success()` (per GitHub's own expression documentation -- reasoned from the docs, not measured
  # live), so the effective condition was `success() && needs.trunkGate.result == 'failure'`, and
  # `success()` is false exactly when a needed job failed. Self-contradictory, and dispatcher measured it
  # directly: 5 of the newest 40 trunk-guard runs had `trunkGate=failure`, and `decideRevert` read `skipped`
  # in all five. `always()` LIFTS the implicit success -- it does not make the job unconditional, because
  # the explicit `result == 'failure'` checks still do the discriminating. `cancelled` (someone manually
  # cancelled the run) is still correctly excluded: `always()` does not turn a cancellation into a failure,
  # it only stops a real failure from being silently treated as one. `trunkBuildTest` reads `skipped` (not
  # `failure`) when `trunkGate` itself failed -- its own `needs:` default already stopped it from running --
  # so checking both results here does not double-count the revert-guard's own failure as if the suite had
  # also failed.
  decideRevert:
    needs: [trunkGate, trunkBuildTest]
    if: always() && (needs.trunkGate.result == 'failure' || needs.trunkBuildTest.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build
      # THE PAT, NOT `github.token`, AND FOR TWO INDEPENDENT REASONS -- either one alone is sufficient,
      # which is why fixing only the more visible of them produces a WORSE failure than the one it fixes.
      #
      # 1. `GITHUB_TOKEN` CANNOT OPEN A PR HERE AT ALL. Measured on run 34275102543, the first run in which
      #    this job ever reached its READY path: it decided correctly, cut `revert/4e87c87565-316`, pushed
      #    it, and then died on `gh pr create` with `GraphQL: GitHub Actions is not permitted to create or
      #    approve pull requests (createPullRequest)`. That is a REPOSITORY setting, confirmed from the API
      #    rather than inferred -- `gh api repos/<owner>/<repo>/actions/permissions/workflow` answers
      #    `{"default_workflow_permissions":"read","can_approve_pull_request_reviews":false}` -- and it
      #    blocks `GITHUB_TOKEN` REGARDLESS of the `permissions:` block above, which already grants
      #    `pull-requests: write` and already did on that run. So the obvious remedy (add the scope) adds a
      #    scope that is present, fails identically, and reads as "the fix did not take".
      # 2. A PR OPENED WITH `GITHUB_TOKEN` FIRES NO `pull_request` EVENT (#416, the same fact `auto-arm`
      #    warns about below). `gate` would never run on the revert PR, `auto-arm` would never arm it, and
      #    the revert would sit unmergeable with no checks -- which LOOKS like success from every angle
      #    except the one that matters. So flipping the repository setting would not be sufficient either.
      #
      # The fallback is deliberate and mirrors `auto-arm.yml`'s three sites exactly: with no secret the job
      # still runs the DECISION and still pushes the branch, and warns about what it cannot then do. A
      # refusal here would throw away a correct verdict over a missing credential; a silent fallback would
      # produce the unmergeable PR of (2) with nothing saying so.
      #
      # Note the `git push` is NOT affected by any of this: it goes through the checkout's persisted
      # credentials under `contents: write`, which is why the push succeeded on the run above while the
      # `gh` call did not. Two different credentials in one step, and only one of them moved.
      # #616: WAS THE PARENT GREEN BECAUSE IT WAS CORRECT, OR BECAUSE IT WAS MEASURED EARLIER?
      #
      # Every other input to the decision below is a RECORDED conclusion, true as of the moment it was
      # taken. On 2026-09-09 `main` went red on a wall-clock assertion; the parent was green, verifiably,
      # in its own run sixty-one minutes earlier; the decision reached READY and opened a revert PR
      # against a merge that had broken nothing. The input silently encoded the time it was read, so the
      # revert's own freshness check inherited the staleness it was measuring.
      #
      # NO THRESHOLD FIXES THIS. "Only trust a parent measured in the last N minutes" needs N to exceed
      # the slowest honest gap between two trunk runs, and the case that matters fits inside it -- the
      # same shape as #590, where a staleness threshold could not see a nineteen-hour silence because the
      # workflow's own worst legitimate gap was twenty-two hours. The only way to turn a stale boolean
      # into a current one is to ask again, now.
      #
      # WHY THE WHOLE SUITE RATHER THAN THE FAILING FILE. Re-running only the failing test file would be
      # far cheaper and is the intended optimisation -- but the failing FILE is not reliably recoverable:
      # `node:test`'s TAP output names the failing test (`not ok 1413 - the summary states WHEN ...`) and
      # not the file it came from. Narrowing on a parse of that would be a guess, and a guess here decides
      # whether somebody's merged work is deleted. One extra run on a path that fires rarely is the right
      # trade until the runner reports the file.
      #
      # ONLY WHEN `trunkBuildTest` FAILED. `trunkGate` asks whether THIS PUSH silently reverted work
      # already on main -- a question about this merge's own two parents, which has no meaning evaluated
      # at the parent. So a trunkGate-only failure passes `pass` with that reason stated here rather than
      # inferred: it is not "we checked and it was fine", it is "this class of failure cannot be
      # inherited or caused by the world".
      - name: Does the parent fail the same check NOW? (#616)
        id: recheck
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ]; then BEFORE="$(git rev-parse HEAD^1)"; fi
          if [ "${{ needs.trunkBuildTest.result }}" != "failure" ]; then
            echo "trunkBuildTest did not fail, so the failure is trunkGate's -- a question about THIS"
            echo "merge's own parents, which cannot be inherited or caused by the world. Recording pass."
            echo "result=pass" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # #775: A CLONE, NEVER A LINKED WORKTREE. `git worktree add` pins the WORKING TREE at `$BEFORE`
          # but shares the underlying repository -- objects AND refs -- with this checkout, so
          # `refs/remotes/origin/main` inside the pinned worktree was never `$BEFORE`'s own `origin/main`,
          # it was whatever `origin/main` is in the SHARED repository right now. #744 (PR #774) proved this
          # with a real reproduction: any test the parent's own suite runs that reads `origin/main`
          # directly (this repo has several) sees main AS IT IS NOW, not as it was when the parent was
          # last green -- which is exactly how a correct revert was declined as unattributable on #718. A
          # fresh clone has its own independent `.git`, so its `refs/remotes/origin/main` can be set to
          # `$BEFORE` without touching this checkout's real one.
          git clone --quiet . /tmp/parent
          git -C /tmp/parent update-ref refs/remotes/origin/main "$BEFORE"
          git -C /tmp/parent checkout --quiet --detach "$BEFORE"
          cd /tmp/parent
          # `|| true` on each: a re-check that CANNOT RUN must report unknown rather than fail, and a
          # non-zero from `npm ci` is not the same answer as a non-zero from the suite.
          if ! npm ci --ignore-scripts > /tmp/parent-install.log 2>&1; then
            echo "::warning::could not install at the parent; the re-check is UNKNOWN, not a pass."
            echo "result=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm run build > /tmp/parent-build.log 2>&1 || true
          if npm test > /tmp/parent-test.log 2>&1; then
            echo "the parent PASSES the suite now -- its recorded green is still the answer."
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "the parent FAILS the suite now, on a tree this push did not touch."
            # #744: NEVER `tail -40` -- the last forty lines of a node:test run are the trailing PASSING
            # subtests, not the failure. Measured live on #718: a genuine failure produced a step output of
            # nothing but `ok 4180`/`ok 4181`/`ok 4182`, and `decideRevert` correctly declined to act on a
            # verdict naming no cause -- so a real revert was refused and main stayed red for ninety
            # minutes. `parent-recheck-summary.mjs` prints the actual `not ok` lines and the `# fail N`
            # summary, wherever they sit in the log, and reports `unknown` rather than `fail` when it
            # cannot name a real failing subtest -- `decideRevert` already treats `unknown` as CANNOT_ASK,
            # never as grounds to refuse a genuine revert.
            cd - >/dev/null
            node scripts/parent-recheck-summary.mjs /tmp/parent-test.log | tee /tmp/parent-summary.log
            RECHECK_RESULT="$(grep -oE 'RECHECK_RESULT=(fail|unknown)' /tmp/parent-summary.log | tail -1 | cut -d= -f2)"
            echo "result=${RECHECK_RESULT:-unknown}" >> "$GITHUB_OUTPUT"
          fi

      - name: Revert this push, unless the failure is inherited or main has already moved on
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$A11IGN_BOT_TOKEN" ]; then
            export GH_TOKEN="$A11IGN_BOT_TOKEN"
          else
            echo "::warning::A11IGN_BOT_TOKEN is not set -- the revert decision and branch push still run, but this repository forbids GitHub Actions from creating pull requests, so the pr-create call will refuse; and a PR it did create would fire no workflow events, so the gate check would never run on it. See #575."
            export GH_TOKEN="$FALLBACK_TOKEN"
          fi
          # `github.event.before` only exists on a real `push` event. #417's sweep triggers this workflow
          # via `workflow_dispatch` (no such field), so fall back to the checked-out commit's own parent
          # -- `fetch-depth: 0` above already makes that a real, resolvable commit, and it is the same
          # value a `push` event would have carried for an ordinary single-commit push.
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ]; then BEFORE="$(git rev-parse HEAD^1)"; fi
          node scripts/trunk-revert.mjs \
            --push-sha=${{ github.sha }} \
            --before-sha="$BEFORE" \
            --parent-recheck="${{ steps.recheck.outputs.result }}" \
            --run-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

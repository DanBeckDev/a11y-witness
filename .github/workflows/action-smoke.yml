# Does the ACTION work? Nothing verified this before, and the action is the entire adoption path.
#
# `capture-regression.yml` runs on Windows and calls the harness directly, re-implementing the action's
# setup by hand. So the steps in `action.yml` — NVDA install, Speech Viewer off, Edge first-run
# suppression, the local scorer — had never once been executed as written, and the two step lists can
# drift with nothing to notice. A consumer's first experience of this project runs code no test touches.
#
# This job is deliberately a CONSUMER's usage: `uses: ./`, inputs only, no repo knowledge. If it passes,
# a stranger can add five lines to a workflow and get a report. If it fails, nothing else about the
# release matters.
name: action-smoke

on:
  push:
    # PATH-FILTERED, AND THE FILTER WAS INCOMPLETE — corrected 2026-09-06 by
    # `workflow-path-coverage.test.ts` on its first run.
    #
    # The list named the packages the action obviously involves and stopped at the ones it names directly.
    # But `@a11y-witness/cli` — the thing this workflow runs — depends on `evidence`, `judge`, `scorer` AND
    # `worker-fleet`, and `judge` and `scorer` each depend on `evidence` again. So a change to the
    # announcement grammar or the verify predicates in `packages/evidence/src` changes what a consumer's
    # report SAYS, and did not run this smoke test. That is the `capture-regression.yml` defect exactly —
    # *"filtered to packages/lab/src/capture/**, so it did not fire for packages/lab/src/training/**, which
    # is exactly where the guard bug lived"* — in a second workflow, found by a guard rather than by an
    # incident. `evidence` and `worker-fleet` are now named.
    #
    # WHAT IS STILL EXCLUDED, AND WHY THAT IS SAFE: `lab`, `control`, `nvda-speech`, `scripts/` and
    # `docs/`. None is a dependency of `cli` (`internalDependencies` in `scripts/isolation-gate.mjs`
    # computes the same closure for the packing gate), and none ships in the action: `lab` and `control`
    # are `private: true`, `nvda-speech` is a standalone port, and `scripts/` holds repo tooling a consumer
    # never installs. A change to any of them cannot alter what `uses: ./` does.
    #
    # `lint.yml` carries no path filter at all and runs the whole suite on every push, so nothing here is
    # unreachable today — that backstop is what makes these exclusions cheap, and
    # `workflow-path-coverage.test.ts` asserts it still exists rather than leaving it as a thing everyone
    # assumes.
    paths:
      - "action.yml"
      - ".github/workflows/action-smoke.yml"
      - "packages/cli/**"
      - "packages/judge/**"
      - "packages/scorer/**"
      - "packages/nvda-worker/**"
      - "packages/evidence/**"      # cli, judge and scorer all depend on it — see above
      - "packages/worker-fleet/**"  # cli depends on it
      - "package.json"
  workflow_dispatch:

jobs:
  consumer:
    # Windows because NVDA is Windows-only; the action refuses other runners by design.
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # TWO runs, each guarding one DIRECTION, because for an accessibility tool the two failures are not
      # symmetrical. A missed finding costs a user; an invented one is an accusation someone may be
      # challenged over. Both pages are published by W3C WITH their own conformance claim, so the expected
      # answer is not our opinion.
      #
      # Run 1 — a page W3C publishes as fully WCAG 2.0 AA conformant. It must produce NO 1.1.1 finding.
      # This is a live regression test for a real defect: Chromium exposes a CSS `list-style-image` bullet
      # as an unnamed role=image node, and the census counted two of them, so this tool accused a
      # conformant page of having images with no text alternative. Measured 0 rule findings after the fix,
      # with probing ON.
      - name: Run a11y-witness as a consumer would
        id: witness
        uses: ./
        with:
          url: https://www.w3.org/WAI/demos/bad/after/survey.html
          task: "Submit the survey without filling it in and see what is announced."
          judge-backend: local

      - name: A conformant page must produce a report, an interaction, and NO 1.1.1 accusation
        shell: bash
        run: |
          path="${{ steps.witness.outputs.result-json }}"
          if [ -z "$path" ]; then echo "::error::the action produced no result-json output" >&2; exit 1; fi
          test -s "$path" || { echo "::error::result-json path '$path' is empty or missing" >&2; exit 1; }
          # --expect-activation because `probe-forms` DEFAULTS on here: a default run that operates nothing
          # means the default silently regressed and every 3.3.1/4.1.3 finding is unreachable while this
          # job stays green. --forbid-wcag because W3C publishes this page as conformant, so any 1.1.1
          # finding is a false accusation by their own claim. --require-rule-layer because `axe` DEFAULTS
          # on too, and `ruleBased: null` on a run that never opted out is the axe layer silently failing
          # to launch — exactly what happened on every Action run before this assertion existed.
          node packages/lab/src/harnesses/assert-action-report.mjs "$path" \
            --expect-activation --forbid-wcag=1.1.1 --require-rule-layer

      # Run 2 — the mirror, and the reason run 1 cannot stand alone. A guard that silences real findings
      # would pass run 1 perfectly. This is W3C's published INACCESSIBLE demo, whose home page exposes 33
      # images with no accessible name, so 1.1.1 MUST fire. Measured: 8 rule findings, including
      # "33 of 39 images expose no accessible name".
      - name: The inaccessible demo must still be caught
        id: inaccessible
        uses: ./
        with:
          url: https://www.w3.org/WAI/demos/bad/before/home.html
          task: "Find the main navigation and reach the survey."
          judge-backend: local

      - name: 1.1.1 must fire on the page that really fails it
        shell: bash
        run: |
          path="${{ steps.inaccessible.outputs.result-json }}"
          test -s "$path" || { echo "::error::the inaccessible run produced no result-json" >&2; exit 1; }
          node packages/lab/src/harnesses/assert-action-report.mjs "$path" --require-wcag=1.1.1 --require-rule-layer

      # NAMED BY THE PATH THE ACTION ALWAYS WRITES, never by the failing step's OUTPUT.
      #
      # This read `steps.witness.outputs.result-json`, which that step sets on its LAST line — so when it
      # failed, the output was never set, the expression rendered empty, and this step died with
      # "Input required and not supplied: path". A failure handler that fails precisely when it is needed:
      # every one of the 85 consecutive red runs discarded the report that would have explained it, and
      # `if-no-files-found: ignore` meant it did so quietly even on the runs where `path` was non-empty.
      #
      # `action.yml` writes to `$RUNNER_TEMP/a11y-witness-result.json`, a constant assigned BEFORE the CLI
      # is invoked, so the file exists whatever happens next — which is the whole point of collecting it.
      # The summary rides along for the same reason. `warn` rather than `ignore`: if this now collects
      # nothing, that is itself a finding about the run, and silence is what hid the bug for 85 runs.
      #
      # NOTE, not fixed here: both `uses: ./` runs write the SAME filename, so run 2 overwrites run 1.
      # That only loses information when run 1 passed and run 2 failed; naming them apart needs an input
      # on `action.yml`, which is a consumer-facing change and does not belong in a workflow fix.
      - name: Keep the report when this fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: action-smoke-report
          path: |
            ${{ runner.temp }}/a11y-witness-result.json
            ${{ runner.temp }}/a11y-witness-summary.md
          if-no-files-found: warn

name: auto-arm

# ENABLE AUTO-MERGE ON EVERY NON-DRAFT PR AGAINST main, SO NOBODY ARMS BY HAND AGAIN -- pipeline unit 1,
# board decision via `ceo`/`dispatcher`, #298.
#
# `gh pr merge --auto --merge` only ARMS the merge; it does not complete one. GitHub itself still withholds
# the actual merge until every required status check (`gate`, `ci.yml`) reports green for the CURRENT head
# -- arming early costs nothing and is what removes "somebody has to remember to click the button" as a
# step in every PR's life.
#
# ## Why this alone would NOT have been safe, and what makes it safe here
#
# `main`'s branch protection runs with `strict=false` (#277): GitHub completes a merge the instant `gate`
# is green for the head IT HAS RECORDED, with no requirement that the head still contains `main`'s current
# tip. #195 (GitHub's recorded head disagreed with the branch's real tip) is exactly the defect a bare
# version of this workflow would have let through. `ci.yml`'s `mergeSafety` job
# (`scripts/merge-guard.mjs --ci-gate`) is now part of the required `gate` context and refuses that shape
# (#294) -- see that job's own comment for why it is architecturally safe to run mid-workflow where
# `merge-guard.mjs`'s human-facing check-run inspection is not, and why it deliberately does NOT also
# check ancestry (#182) or closing-claim (#262): both refuse the NORMAL case when CI, which has no way to
# know who is asking or that the queue moves faster than any one branch stays current, asks them. So
# arming here is safe BY CONSTRUCTION for the one thing CI can answer: GitHub cannot complete a merge this
# workflow arms without `gate` -- and therefore `mergeSafety` -- reporting green for the real, current head.
#
# ## `opened` and `ready_for_review` ARE NOT ENOUGH -- `synchronize` closes a real gap, #415
#
# Arming is idempotent and only needs to happen once per PR; GitHub keeps auto-merge enabled across every
# later push on its own, so re-arming on every `synchronize` is a redundant API call on most commits, with
# no behavioural difference for a PR that was already armed. THAT case is not why `synchronize` is here.
#
# **A PR opened WHILE IT CONFLICTS gets neither `opened` nor `ready_for_review`** -- GitHub does not
# dispatch `pull_request` workflows for a PR whose merge commit it cannot compute, so both of this
# workflow's original triggers are spent before the author can even fix the conflict. Resolving it is a
# push -- a `synchronize` -- which this trigger list did not listen for, so `arm` never saw the one event
# left. Measured on #402: opened while `mergeable: CONFLICTING`, zero `ci` runs and zero `auto-arm` runs at
# `opened`, and none at the `synchronize` that fixed the conflict either, because nothing was listening.
# `#403`, opened ten seconds later and not conflicting, got both events normally -- same author, same
# minute, the only variable was whether GitHub could compute a merge ref at `opened`.
#
# `sweep` (below) still finds such a PR EVENTUALLY -- it runs on every event this workflow takes -- but
# only on the NEXT unrelated PR event anywhere in the repo, which in a quiet period is unbounded. #402 sat
# unarmed from 00:22 until swept by hand. `synchronize` bounds this to the fix itself: the moment the
# conflict is resolved, `arm` sees it directly instead of waiting on someone else's PR.
#
# ## AND THAT IS WHY A SWEEP IS NEEDED, NOT A THIRD TRIGGER -- #344, measured 2026-09-07
#
# The paragraph above is correct and answers a different question from this one. A PR that was ALREADY
# OPEN when this workflow shipped (10:38Z, 2026-09-07) has no `opened` and no `ready_for_review` event
# left to fire, so nothing ever arms it and nothing ever will. Measured at 11:35Z, four hours later:
#
#   [276, 183, 181, 172]   open, base main, not draft, autoMergeRequest = null
#
# #183 and #181 were GREEN ON `gate` and unarmed since 01:39 and 01:27 -- six hours in a queue the
# pipeline could not see. `synchronize` would not have fixed it either: a PR nobody pushes to produces no
# `synchronize` event any more than it produces a second `opened`.
#
# ## Why the sweep rides on the EXISTING trigger and is NOT scheduled
#
# `board-liveness.test.ts` pins the measurement: GitHub disables scheduled workflows repository-wide after
# 60 days of inactivity, and `board-schedule-liveness.test.ts` records `board-report.yml` firing ZERO
# scheduled runs the day after it was added. An arming sweep on a cron therefore fails by stopping
# silently, and its symptom -- PRs quietly not merging -- reads as workers being slow rather than as a
# dead trigger. A sweep that rides on `pull_request` cannot have that fault: the event it needs is another
# PR being opened, which in this repo is the most frequent event there is (11 in the hour this was
# measured). The queue drains within one PR of any PR.
#
# `workflow_dispatch` is here for the case the sweep exists to cover in the first place: a quiet repo with
# a stranded PR and no incoming event to ride. It is a manual kick, not a schedule, so nothing can disable
# it for inactivity.
#
# ## Why DRAFT is excluded, explicitly, rather than left to GitHub
#
# `gh pr merge --auto` REFUSES a draft PR outright ("--auto is not allowed for draft PRs"), so admitting
# one here would just fail loudly. Excluding it here means the run reports `SKIPPED (draft)` instead of a
# needless GitHub API error on every draft PR opened in this repo.
#
# ## `reopened` -- #404, found resuming #232 and #281
#
# Without it, a REOPENED PR fires neither `opened` nor `ready_for_review`, so `arm` never sees it. The
# `sweep` job below still picks it up eventually (it runs on every event this workflow takes), but only
# on the NEXT PR event anywhere in the repo -- an unbounded wait in a quiet repo. Worse than the delay:
# `ceo`'s ruling is that nobody re-arms a PR auto-arm has already armed, because the merge is attributed
# to whoever last enabled auto-merge, and a `github-actions`-attributed merge does not apply `Closes #N`
# while a PAT merge does (12 for 12 measured 2026-09-07) -- so a PR this trigger never armed is the ONE
# case where a worker must legitimately arm it by hand, an exception nobody but the person who hit it
# could be expected to know exists. Adding `reopened` removes the exception rather than documenting it,
# which is this repo's own preference: a rule that asks a human to remember something is a rule that
# gets broken.
#
# ## `A11IGN_BOT_TOKEN`, WITH A FALLBACK -- #416, measured 2026-09-08
#
# GitHub does not trigger workflows from events created with `GITHUB_TOKEN`. A merge completed by
# `github-actions[bot]` -- every merge THIS workflow arms and GitHub later completes -- fires neither
# `pull_request: closed` nor a `push`, so `trunk-guard`, `close-rows` and every push watchdog go silent
# for exactly the merges the pipeline performs (37 data points, no exceptions: 18 of 18 PAT merges ran
# `close-rows`, 19 of 19 bot merges never did; 5 of 5 sampled bot-merge SHAs never ran `trunk-guard` at
# all). Arming with a real, fine-grained PAT instead means the completed merge is attributed to that
# identity, its push fires every trigger that currently goes silent, and `Closes #N` closes natively.
#
# CREATING THE TOKEN IS NOT PART OF THIS ROW -- `ceo` asks the chairman for it; nobody here creates, reads
# or pastes it. This is the workflow's half: read the secret when present, and FALL BACK to `GITHUB_TOKEN`
# with a printed warning when it is not, so the pipeline keeps arming before the token exists rather than
# stopping -- #382's own lesson: a job that cannot do its intended work must say which path it took, not
# go silent. The SAME four-line shell snippet appears in both `arm` and `sweep` below, deliberately: the
# decision is one `[ -n "$A11IGN_BOT_TOKEN" ]` test, trivial enough that a composite action to share it
# would be more surface than the thing it shares -- unlike the real logic elsewhere in this pipeline
# (`closurePlan`, `stalledVerdict`) that this repo is right to insist on a single copy of.
#
# NOT `issues: write` for this -- #333 already measured that granting it changed nothing, because the
# native `Closes #N` closure is performed by GitHub AS THE MERGING IDENTITY and needs no extra grant on
# the workflow's own token. The permission stays here (below) for #298's existing bot-merge case, which
# this token change does not remove until every merge in this repo's history is one.
#
# THE SECRET IS NEVER ECHOED, NEVER AN ARGUMENT, NEVER LOGGED -- it goes through an `env:` mapping into
# `GH_TOKEN` exactly the way `PR_BODY` is handled in `ci.yml`'s `acceptance` job, and for the same reason:
# `gh`'s own CLI reads `GH_TOKEN` from the environment, so the value never appears on a command line a
# log could capture.
#
# EXPIRY IS A SCHEDULED OUTAGE. A 90-day PAT stops working on a known date, and the failure mode is this
# same fallback -- a silent reversion to today's defect, not a loud one. Record the expiry wherever this
# repository already tracks dated obligations once the token exists; this workflow cannot see its own
# secret's expiry date to warn about it in advance.
#
# ## `push: [main]`, AND `update-branch` BELOW -- C2, #416's sibling
#
# Arming a PR does not keep it current: `main`'s branch protection runs with `strict=false` (#277), so an
# armed PR merges the instant its OWN `gate` is green, with no requirement that its head still contains
# whatever landed on `main` since. Every merge this pipeline completes therefore leaves every OTHER open,
# armed PR one merge further behind -- and nothing was pushing them back up, which is `queue-stalled.mjs`'s
# entire subject: it REPORTS a PR that has drifted into a real conflict, it does not fix one. `update-branch`
# is the fix half, riding the one event that means "the queue just moved": a push to `main`.
on:
  pull_request:
    # #1094: `auto_merge_enabled` is the event on which update-branch's second input (is it armed) flips,
    # whoever armed it -- the arm job, pr:open at creation, or a hand `gh pr merge --auto`.
    types: [opened, ready_for_review, reopened, synchronize, auto_merge_enabled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  # ISSUES: WRITE, OR THE PIPELINE CANNOT CLOSE THE ROWS IT FINISHES -- #298, measured 2026-09-07.
  #
  # GitHub closes an issue referenced by `Closes #N` AS THE ACTOR THAT MERGED. When auto-merge was armed
  # by this workflow, that actor is `github-actions[bot]`, carrying THIS file's token -- so without
  # `issues: write` the merge succeeds, the reference is silently ignored, and nothing anywhere reports it.
  #
  #   PR #323  merged_by=github-actions[bot]  Closes #314  ->  #314 stayed OPEN
  #   PR #315  merged_by=github-actions[bot]  Closes #11   ->  #11  stayed OPEN
  #   PR #301  merged_by=DanBeckDev           Closes #292  ->  #292 closed
  #
  # Same target branch, same `auto_merge=true`, same plain-text `Closes #N`. The only difference was who
  # merged. #314's timeline carries `cross-referenced` and `referenced` and no `connected` and no `closed`:
  # GitHub saw the mention and could not act on it.
  #
  # It fails by making NOTHING happen, which is why it needed an audit to find rather than a red run. And
  # `Closes #N` is the tracker's whole closing mechanism under the pipeline, so the drift is proportional
  # to how much work the pipeline does -- fastest exactly when things are going best.
  issues: write

jobs:
  arm:
    if: github.event.pull_request.draft == false && github.event.pull_request.base.ref == 'main' && github.event.action != 'auto_merge_enabled'
    runs-on: ubuntu-latest
    steps:
      # #645: this step ran `gh pr merge --auto` UNCONDITIONALLY, so a PR held by a ruling was re-armed by
      # its own next event -- `auto-arm-sweep.mjs` refused a held PR and this path did not. Both now read
      # one predicate (`pr-hold-state.mjs`); a second correct copy would have been the same shape with a
      # longer fuse. It needs a checkout, which this job did not previously have.
      - uses: actions/checkout@v4
      - name: Enable auto-merge (merge commit) -- unless held. GitHub still withholds until `gate` is green
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$A11IGN_BOT_TOKEN" ]; then
            export GH_TOKEN="$A11IGN_BOT_TOKEN"
          else
            echo "::warning::A11IGN_BOT_TOKEN is not set -- arming with GITHUB_TOKEN instead. A merge completed with it fires no workflow events (trunk-guard, close-rows, the push watchdogs) -- see #416. And arming with it fires no auto_merge_enabled run, so update-branch does not sweep on arming and #1094 returns with no log line -- see #1094."
            export GH_TOKEN="$FALLBACK_TOKEN"
          fi
          node scripts/arm-pr.mjs --pr="${{ github.event.pull_request.number }}" --repo="${{ github.repository }}"

  sweep:
    # ARM EVERY PR THE `arm` JOB ABOVE CANNOT SEE -- the ones already open, #344.
    #
    # It runs on EVERY event this workflow takes, including the `pull_request` that just armed one PR, so
    # it is the same question asked of the STANDING QUEUE rather than of the event's own PR. Arming is
    # idempotent, so re-running it costs one list call and nothing else.
    #
    # The decision lives in `scripts/auto-arm-sweep.mjs` -- which PRs it refuses and why is documented and
    # unit-tested there, because a predicate written in `run:` bash can only ever be checked by asserting
    # on the text of a shell script, and a guard whose expectations are scraped out of the source it tests
    # is this repository's own recorded defect. The script imports nothing but `node:*`, so this job needs
    # a checkout and NOTHING else -- no `npm ci`, no build, no `dist`. #330 and #331 record what it costs
    # when a bootstrap script reaches for a workspace package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arm every open, non-draft, unheld, tested PR against main that nothing has armed
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
          FALLBACK_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$A11IGN_BOT_TOKEN" ]; then
            export GH_TOKEN="$A11IGN_BOT_TOKEN"
          else
            echo "::warning::A11IGN_BOT_TOKEN is not set -- arming with GITHUB_TOKEN instead. A merge completed with it fires no workflow events (trunk-guard, close-rows, the push watchdogs) -- see #416. And arming with it fires no auto_merge_enabled run, so update-branch does not sweep on arming and #1094 returns with no log line -- see #1094."
            export GH_TOKEN="$FALLBACK_TOKEN"
          fi
          node scripts/auto-arm-sweep.mjs

  stalled:
    # NAME THE ARMED, GREEN PRs THAT CAN NEVER MERGE -- #361, the gap `sweep` above closes at the OTHER
    # end. `sweep` reports every PR it will NOT arm, with a reason; it says nothing about a PR it DID arm,
    # because from its side arming succeeded. GitHub then declines to complete the merge (a real content
    # conflict against the current `main`) and tells nobody -- measured 12.5 PR-hours of two workers'
    # finished work, invisible, found only by a dispatcher who happened to ask.
    #
    # REPORTS, NEVER ACTS -- no rebase, no branch update, no close. `scripts/queue-stalled.mjs`'s own
    # header has the full derivation, the incident, and why `git merge-tree` rather than GitHub's own
    # (lazily-computed, and read `UNKNOWN` on both real PRs at the moment of measurement) `mergeable`.
    #
    # RIDES THE SAME `pull_request` TRIGGER `sweep` DOES, for the identical reason: a scheduled sweep
    # fails by going quiet after GitHub disables it for 60 days of repo inactivity, and a stall reporter
    # that fails by going quiet has the disease it watches for.
    #
    # `fetch-depth: 0` (full history), THEN an explicit fetch of every branch tip -- `actions/checkout@v4`
    # only brings the triggering PR's own head, and `git merge-tree` needs a real merge-base with EVERY
    # other open PR's head, which a shallow clone cannot supply. `queue-stalled.mjs`'s own `main()` does
    # the branch-tip fetch; this step only needs enough history depth for `git merge-tree` to find a
    # common ancestor at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report every armed, green PR that cannot merge as-is against main
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/queue-stalled.mjs

  update-branch:
    # PUSH EVERY ARMED, GREEN-OR-RUNNING PR UP TO main's NEW TIP -- C2, #416's sibling.
    #
    # `arm` and `sweep` above get a PR INTO the queue; nothing pushed one back up once `main` moved past
    # it, which is `queue-stalled.mjs`'s entire subject one step further along -- it only ever REPORTS a
    # drifted PR. This job runs `gh pr update-branch` itself, on the one event that means "the queue just
    # moved": a merge landing on `main`. `scripts/update-branch-sweep.mjs` has the full decision and why
    # `git merge-base --is-ancestor` is used instead of GitHub's lazily-computed `mergeStateStatus`.
    #
    # ONLY ON `push`, never on the `pull_request` events the jobs above ride -- a fresh PR being opened or
    # synchronized has not moved `main`, so there is nothing here for it to do.
    #
    # NO `GITHUB_TOKEN` FALLBACK, unlike `arm`/`sweep` -- see the script's own header. GitHub does not fire
    # `pull_request: synchronize` for a push made with `GITHUB_TOKEN`, so updating a branch under it would
    # give a PR a new head with no check run ever triggered for it and its required checks waiting forever
    # -- worse than leaving it alone at its old, already-checked head. The step SKIPS outright rather than
    # degrading, the one case in this file where a missing secret means "do nothing" instead of "do it
    # anyway and warn". Failing loudly and doing nothing beats succeeding quietly -- and it means this job
    # degrades SAFELY if the token is ever revoked: PRs simply stay visibly behind, rather than
    # accumulating untested heads nobody can see.
    #
    # `TRUNK_FOLLOWUP_ALLOWLIST` (`push-trigger-allowlist.test.ts`) -- ceo's ruling, 2026-09-08. This is
    # neither of the two shapes that file's chairman-derived rule already recognised: not a schedule
    # watchdog (there is no cron here for GitHub to silently disable), and not `trunk-guard.yml`'s reactive
    # check on main's OWN tip. It is a third, narrower shape: a push-to-main job that acts on OTHER open
    # PRs after a merge, never on main's own tip, and can never gate anything because the merge it reacts
    # to already happened. `continue-on-error: true` is REQUIRED by that category's own definition, not
    # optional here -- a red run must never read as a gate failure when nothing downstream waits on it.
    # #1094: ALSO on `auto_merge_enabled`. The decision has two inputs -- has main moved, and is this PR
    # armed -- and the push-only gate reasoned about the first alone. Measured 2026-09-12: a merge landed
    # 10:27:07Z, the sweep read #1080 as "not armed" at 10:27:15Z, ReadyForReview 10:28:13Z, AutoMergeEnabled
    # 10:28:23Z, and with every other PR a draft no push could come; #1080 sat green, armed and BEHIND for
    # 57 minutes until a person ran `gh pr update-branch`. `auto_merge_enabled` is the event on which the
    # second input flips, whoever armed it; `ready_for_review` is NOT enough (ten seconds too early, and a
    # PR readied earlier and armed by hand never fires it). `opened` and `synchronize` stay excluded:
    # neither moves main nor arms anything. The token contract below is unchanged: no GITHUB_TOKEN
    # fallback on any event.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'auto_merge_enabled')
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update every armed, green-or-running, behind PR to main's current tip
        env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          # #1094 item 3: the two causes of this sweep must not render the same sentence.
          if [ "$EVENT_NAME" = "push" ]; then
            echo "UPDATE-BRANCH: ran because main moved (push)"
          else
            echo "UPDATE-BRANCH: ran because #${EVENT_PR} armed (auto_merge_enabled)"
          fi
          if [ -z "$A11IGN_BOT_TOKEN" ]; then
            echo "::warning::A11IGN_BOT_TOKEN is not set -- SKIPPING update-branch entirely, not falling back to GITHUB_TOKEN. A push made with GITHUB_TOKEN fires no pull_request: synchronize, so an updated PR would get a new head with no check run ever triggered for it -- worse than leaving it alone. See #416/C2."
            exit 0
          fi
          export GH_TOKEN="$A11IGN_BOT_TOKEN"
          node scripts/update-branch-sweep.mjs

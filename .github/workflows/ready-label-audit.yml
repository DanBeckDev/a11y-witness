name: ready-label-audit

# `ready` MUST BE MUTUALLY EXCLUSIVE WITH EVERY LABEL THAT ALREADY MEANS "NOT ACTUALLY PICKABLE" (#121),
# and until now `npm run ready:audit` -- the command built to prove that -- was invoked by NOTHING. #246:
# three real rows sat `ready` + `in-progress` + `session:*` (claimed and started, still advertising as
# pickable) and were found by a human reading `gh issue list --label ready` by hand, not by this check.
#
# IT AUDITS LIVE GITHUB LABEL STATE, which no commit touches -- so there is no "the push that broke it"
# to attach a red mark to, and no reason to gate a merge on it.
#
# THIS SECTION USED TO SAY "Runs hourly rather than daily", AND THAT WAS NEVER TRUE (#536). The cron below
# asks for 27 runs in 27 hours. Measured 2026-09-08, it delivered SEVEN: 13:30, 18:43, 22:01, 00:25, 05:58,
# 11:20 and 16:38 -- never at :17, and three gaps over five hours. GitHub delays and drops scheduled runs
# on a busy repo, so a cron reading hourly delivers roughly daily: the exact cadence this header rejected
# as too slow for the incident it was written for. A check that runs three times a day cannot be called
# hourly, and a stated cadence nobody measured is a claim, not a schedule.
#
# SO THE EVENTS BELOW ARE THE MECHANISM AND THE CRON IS THE BACKSTOP. Each event is a moment the audit's
# answer can CHANGE, which is a stronger reason to run than a clock is:
#
#   labeled/unlabeled  a row becomes pickable or claimed, or stops being either -- and removing a label is
#                      when a dead claim or a debris row stops being one, so it is not merely the inverse
#   closed             the moment a row can start carrying debris
#   reopened           a row can come back wearing labels its closure left on it
#
# THERE WAS A FOURTH, `pull_request: [closed]`, AND #579 REMOVED IT -- not because it did not work, but
# because of where GitHub PUTS the answer. A workflow triggered by `pull_request` attaches its check-run
# to that PR's head commit, so this audit's verdict appeared on the PR page as a check named `audit`. It
# is not a check on a pull request: it reports the tracker's live label state, which that PR's diff did
# not touch and cannot affect. Measured 2026-09-08 -- it failed on the board-membership call (the bot PAT
# cannot read Projects v2, #546) and so sat RED on the last seven merged PRs for ninety minutes, which is
# what the chairman was looking at. `audit` is not in the required `gate` context, so it blocked nothing:
# a permanently red mark that blocks nothing is precisely the red people stop reading, which is #536's own
# reasoning arriving through a door this trigger opened.
#
# WHAT IS ACTUALLY LOST, stated rather than waved away. The removed bullet claimed two moments. The first
# -- a merge closing a row -- is fully covered, because `close-rows` closes the row the PR declares and
# `issues: [closed]` above fires on exactly that. The second is NOT: work that SHIPS WITHOUT closing its
# row (#443's shape) touches no issue, so no `issues` event fires and the audit does not run until the
# cron does. That is a real reduction in cadence for one case, and the honest trade is that the cron is
# the backstop for it. It is worth taking because the alternative is a red mark on every merged PR
# answering a question nobody asked on that page.
#
# Neither `unlabeled` nor `reopened` catches a fault the other two miss. They stop the audit answering
# with a state that has already moved, which is the whole value of it: the count has to be current when
# somebody READS it. The cost is a run.
#
# NO `push: branches: [main]`, AND NOT BECAUSE IT WOULD NOT WORK. `push-trigger-allowlist.test.ts` holds
# the chairman's rule that only a watchdog, a trunk gate or a trunk-followup may trigger on a push to
# main, and this audit is none of the three -- it watches no schedule, builds nothing, and touches no
# other PR. Adding a fourth allowlist category to get a merge-time run would be arguing past a guard
# rather than with it.
#
# THIS PARAGRAPH USED TO REST ON THE `pull_request` TRIGGER -- "no allowlist entry is required, because
# that event carries exactly what is needed, scoped to one PR" -- and #579 removed the trigger, so that
# reason is gone and only the rule above still stands. Rewritten rather than left, because a comment
# whose stated reason has been deleted underneath it reads exactly like a live one: this repository's
# most expensive recurring shape, and the whole of #543.
#
# THE CRON STAYS, and it is not redundant: it is the only thing that fires when nothing happens at all,
# which is exactly the state where a stale claim sits unnoticed.
on:
  issues:
    types: [labeled, unlabeled, closed, reopened]
  # NO `pull_request:` HERE -- #579. See the header: the verdict would attach to the PR's head commit as a
  # check named `audit`, reporting tracker state the PR did not touch, and it blocks nothing.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  # Several label changes land in a minute on a busy day, and four triggers make that likelier.
  # One verdict at a time; the newest is the true one. This audit reads live state and accumulates
  # nothing, so a cancelled run loses nothing a later one will not recompute -- same choice and same
  # reason as board-liveness.yml.
  #
  # AND IT FIRES CONSTANTLY, WHICH IS #851's FINDING. Grouped from one `gh run list` call, 2026-09-09:
  #
  #     200 runs today   175 cancelled   24 failed   0 SUCCEEDED
  #     199 on `issues` events, 1 scheduled
  #
  # ZERO SUCCEEDED IS THE NUMBER. Label events arrive faster than this job's 68-118 s, so each run is
  # cancelled by the next before it finishes: the audit did not run slowly all day, it never completed
  # once. `cancel-in-progress` is doing exactly what it says and the result is starvation -- the newest
  # run is always the true one, and the newest run is always about to be replaced.
  #
  # A first draft of this file said the opposite -- that the runs were too far apart to overlap and none
  # was ever cancelled. That was inferred from the job's duration rather than counted, and the count
  # refuted it. The figure is here so the next reader has the measurement rather than the inference.
  #
  # The DEBOUNCE below is what breaks the starvation: a parked run is cancelled having spent nothing, and
  # the last of a burst waits out its two minutes with nothing left to cancel it and RUNS TO COMPLETION.
  # One finished audit per burst, where there were none.
  #
  # THE SCHEDULED RUN IS IN ITS OWN GROUP AND IS NEVER CANCELLED. One scheduled run in 200 says how badly
  # it needed to be: it is the pass a day with no label activity depends on, and in a shared group it is
  # simply the next thing a label event kills.
  group: ready-label-audit-${{ github.event_name == 'schedule' && 'schedule' || 'events' }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: read
  issues: read
  # `fetchClaimActivity` runs `gh pr list` to find each claimed row's open PR, so without this the
  # dead-claim check fails on the GITHUB_TOKEN fallback path too -- and the warning below would then be
  # wrong about which check the missing PAT costs. The PAT carries its own scopes; this is for the
  # fallback, which is the path nobody watches.
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 because the dead-claim check reads `git for-each-ref refs/remotes/origin` to date
      # each row's branch, and the default single-branch fetch leaves only origin/main -- so every claimed
      # row would read "no branch at all", which is the strongest DEAD-CLAIM sentence this audit prints.
      # DEBOUNCE, AND IT IS THE FIRST STEP FOR A REASON: everything after it costs -- a checkout, an
      # `npm ci`, and an audit that reads the tracker. A run cancelled while parked here has spent
      # nothing. A claim writes several labels within seconds and a session working through rows writes
      # dozens over minutes; two minutes collapses each burst to the one run with something new to say.
      #
      # ONLY FOR `issues` EVENTS. The schedule must not be delayed -- it exists for the day nobody
      # touches a label -- and `workflow_dispatch` is somebody waiting at a terminal.
      #
      # A `sleep` rather than a real debouncer because there is nothing to debounce WITH: Actions gives a
      # workflow no queue to inspect. The only mechanism that collapses runs is `cancel-in-progress`, and
      # it was already firing on every one of them -- 175 of 200 cancelled, 0 succeeded. What the parking
      # changes is WHICH run survives and what the others cost: cancelled here, a run has done nothing;
      # and the LAST of a burst waits out its two minutes with nothing left to cancel it, so it finishes.
      # Said plainly rather than dressed up, because a bare `sleep` in a workflow is exactly the shape
      # somebody deletes as pointless.
      - name: Debounce a burst of label events (#851)
        if: github.event_name == 'issues'
        run: sleep 120

      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      # WHICH EVENT WOKE THIS RUN (#536). With five triggers, "the audit is quiet because nothing changed"
      # and "the audit is quiet because nothing fired" are different states and must never read the same.
      # A run that cannot say why it started cannot be told apart from one that should not have.
      - name: Say what woke this run
        run: |
          ACTION="${{ github.event.action }}"
          if [ -n "$ACTION" ]; then WOKE="${{ github.event_name }}.$ACTION"; else WOKE="${{ github.event_name }}"; fi
          echo "ready-label-audit woken by: $WOKE"
          echo "::notice::ready-label-audit woken by $WOKE"
      # `github.token` CANNOT resolve a user-owned ProjectV2 -- measured 2026-09-08, three scheduled runs
      # died on `Could not resolve to a ProjectV2 with the number 2` -- and board membership is one of six
      # checks. The bot PAT (#416) can read it. Same shape as auto-arm.yml's own token choice, including
      # the warning: falling back silently would leave five checks answering and nothing saying why the
      # sixth did not, which is the state this whole change exists to end.
      - env:
          A11IGN_BOT_TOKEN: ${{ secrets.A11IGN_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$A11IGN_BOT_TOKEN" ]; then
            export GH_TOKEN="$A11IGN_BOT_TOKEN"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
            echo "::warning::A11IGN_BOT_TOKEN is not set -- GITHUB_TOKEN cannot resolve a user-owned ProjectV2, so the board-membership check will report as unable to run. See #416."
          fi
          npm run ready:audit

name: trunk-sweep

# #417: THE INTERIM COVER WHILE THE TRUNK IS UNGUARDED AFTER EVERY PIPELINE MERGE.
#
# GITHUB_TOKEN events trigger no workflows -- a merge completed by `github-actions[bot]` (every merge
# `auto-arm.yml` completes) fires neither `pull_request: closed` nor `push`, so `trunk-guard`, `close-
# rows` and all three push watchdogs go silent for exactly the merges the pipeline itself performs.
# Measured 2026-09-08: `main`'s tip after one such merge carried zero check runs.
#
# The permanent fix is #416 (arm with a token whose events fire) and needs the chairman's hands. This
# workflow is what covers the gap until then, and is worth keeping afterward as a net.
#
# TWO INDEPENDENT HALVES, each reusing code that already exists rather than re-deriving it:
#
#   gateSweep        scripts/trunk-sweep.mjs -- if main's tip has zero check runs, trigger trunk-guard.yml
#                     directly (workflow_dispatch, added to that workflow in this same PR). That is the
#                     unit-3 redundancy a bot merge suppressed; decideRevert's own
#                     `if: needs.trunkGate.result == 'failure'` then fires exactly as it would for a real
#                     push, driving the SAME revert machinery.
#   closeRowsSweep    scripts/close-rows-sweep.mjs -- runs closurePlan (close-rows-for-merged-pr.mjs's own
#                     decision, imported not re-derived) over PRs merged into main in the last 60 minutes.
#                     Idempotent by construction: ALREADY CLOSED -- left alone is the common outcome.
#
# WHY --window=60 AGAINST A 15-MINUTE SCHEDULE: deliberate overlap, not a guess. A window can miss (a
# transient API failure, a slow runner start), and the cost of checking the same PR three times over is
# one `ALREADY CLOSED` line; the cost of a 15-minute window matching a 15-minute schedule exactly is a
# single missed tick losing a row silently.
#
# WHY A SCHEDULE HERE, WHEN THIS REPOSITORY DELIBERATELY AVOIDS ONE EVERYWHERE ELSE -- `board-liveness.
# yml` and its siblings are push-triggered on purpose: GitHub disables a scheduled workflow after 60 days
# with NO repository activity at all, and a scheduled watchdog dies in the same breath as the jobs it
# guards. That rule needs 60 days of total silence, which a repository merging a dozen PRs an hour will
# not have -- recorded here so nobody re-derives the objection and re-opens the decision.
#
# The circularity this would otherwise create is real and this is the answer to it: every OTHER watchdog
# here is push-triggered, and push is suppressed for exactly the merges that matter, so a push-triggered
# liveness check on THIS sweep would be dead the identical way. The liveness signal for this workflow
# therefore leaves the event system entirely: the daily board edition prints when the schedule's own run
# list says this last ran, and the PM's summary check flags it stale.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  gateSweep:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: If main's tip has zero check runs, trigger a real gate run against it
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/trunk-sweep.mjs

  closeRowsSweep:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Close any row a merged PR declared that the immediate trigger missed
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/close-rows-sweep.mjs --window=60

# Copy this into .github/workflows/accessibility.yml in your own repository.
#
# What it does: on every pull request, drives a real screen reader (NVDA) over a page, asks whether
# someone using it could actually complete a task, and posts what it heard as a PR comment.
#
# What it is NOT: a replacement for axe-core, or for testing with disabled users. It covers the
# judgement-based failures a rule scanner cannot see — a button announced as "button" with no name, a
# validation error shown only in red, a state change nobody is told about — and it runs axe-core
# alongside for the visual criteria a screen reader cannot perceive.
name: accessibility

on:
  pull_request:
  workflow_dispatch:

jobs:
  screen-reader:
    # NVDA is Windows-only, so this cannot run on ubuntu-latest. The action fails fast and says so if
    # you try.
    runs-on: windows-2022
    timeout-minutes: 25

    # Needed for the PR comment. Without it the run still works and the report lands in the job summary;
    # only the comment is skipped, with a warning rather than a failure. No secret is needed for the
    # default judge.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # No tagged release exists yet, so `@main` is the only ref that resolves — and it moves.
      # Pin the full commit SHA instead if your CI must not change under you.
      - uses: DanBeckDev/a11y-witness@main
        id: witness
        with:
          url: https://example.com/checkout
          # Say what a USER is trying to do, not what you want tested.
          #
          # Know what it affects, though: with `probe-forms: true` — the default, and what is set below —
          # it decides WHICH buttons get activated (a button sharing a meaningful word with the task), so
          # it is LOAD-BEARING on this example as written. With an LLM backend it also drives the "could
          # someone finish this?" verdict; the default `local` scorer never sees it.
          task: Complete the checkout with a saved card

          # No key, no account, nothing leaves the runner. This is the project's own trained scorer:
          # 27 KB of weights shipped in the action, over an encoder fetched at setup. It covers EIGHT
          # WCAG criteria precisely and stays silent on the rest — narrower than an LLM and far more
          # trustworthy (zero false positives across 1,034 conformant records it was measured on).
          #
          # Swap to an LLM if you want it to attempt every criterion, at the cost of noise and a key:
          #   judge-backend: anthropic
          #   anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          judge-backend: local

          # Start here. `never` reports without failing the build, which is how you find out what the
          # tool says about your site before you decide to gate on it. Move to `blocker`, then `serious`,
          # as you fix what it finds.
          fail-on: never

          # ON, which is this action's default, and the line is here to SHOW the default rather than to
          # change it. The example used to set it "false" and explain the CLI's rationale — a copied
          # workflow that silently made two criteria unreachable in a user's first ten minutes.
          #
          # The split is deliberate and follows WHO OWNS THE PAGE (ADR 0024): a workflow runs against your
          # own app, where submitting is intended and 3.3.1 and 4.1.3 are otherwise structurally
          # unreachable — nothing can tell you whether a form says what went wrong without submitting one.
          # The CLI defaults it OFF because it can be aimed at any URL, and pressing "Book" on a
          # stranger's site is not a review.
          #
          # Turn it off only if a submission has consequences you do not want on every run — and know the
          # cost: 3.3.1 (error identification) and 4.1.3 (status messages) then cannot be assessed at all,
          # and the `task` above goes inert, because it is what decides which button gets activated.
          #   probe-forms: "false"
          probe-forms: "true"

      # The report is always in the job summary. Keeping the raw JSON as an artifact is worth it: it has
      # the full transcript, which is the evidence behind every finding.
      # GUARDED ON THE OUTPUT EXISTING, not just on `always()`. A step output is set on the step's last
      # line, so a witness step that FAILED never set `result-json` — the expression then renders empty
      # and upload-artifact dies with "Input required and not supplied: path", turning one red step into
      # two and hiding the report exactly when it is wanted. The identical bug was live in this repo's own
      # `action-smoke.yml` for 85 consecutive runs, each of which discarded the evidence that would have
      # explained it. Do not copy the unguarded form.
      - uses: actions/upload-artifact@v4
        if: always() && steps.witness.outputs.result-json != ''
        with:
          name: a11y-witness-result
          path: ${{ steps.witness.outputs.result-json }}
          if-no-files-found: warn

      - name: Show what it found
        if: always()
        shell: bash
        run: |
          echo "findings: ${{ steps.witness.outputs.findings }}"
          echo "task completable: ${{ steps.witness.outputs.task-completable }}"

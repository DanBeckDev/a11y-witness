# Copy this into .github/workflows/accessibility.yml in your own repository.
#
# What it does: on every pull request, drives a real screen reader (NVDA) over a page, asks whether
# someone using it could actually complete a task, and posts what it heard as a PR comment.
#
# What it is NOT: a replacement for axe-core, or for testing with disabled users. It covers the
# judgement-based failures a rule scanner cannot see — a button announced as "button" with no name, a
# validation error shown only in red, a state change nobody is told about — and it runs axe-core
# alongside for the visual criteria a screen reader cannot perceive.
name: accessibility

on:
  pull_request:
  workflow_dispatch:

jobs:
  screen-reader:
    # NVDA is Windows-only, so this cannot run on ubuntu-latest. The action fails fast and says so if
    # you try.
    runs-on: windows-2022
    timeout-minutes: 25

    # Needed for the PR comment. Without it the run still works and the report lands in the job summary;
    # only the comment is skipped, with a warning rather than a failure. No secret is needed for the
    # default judge.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: a11y-witness/a11y-witness@v1
        id: witness
        with:
          url: https://example.com/checkout
          # Say what a USER is trying to do, not what you want tested. The judge decides whether the
          # announced experience lets someone finish that task, which is a different and more useful
          # question than whether the markup passes rules.
          task: Complete the checkout with a saved card

          # No key, no account, nothing leaves the runner. This is the project's own trained scorer:
          # 27 KB of weights shipped in the action, over an encoder fetched at setup. It covers EIGHT
          # WCAG criteria precisely and stays silent on the rest — narrower than an LLM and far more
          # trustworthy (zero false positives across 1,034 conformant records it was measured on).
          #
          # Swap to an LLM if you want it to attempt every criterion, at the cost of noise and a key:
          #   judge-backend: anthropic
          #   anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          judge-backend: local

          # Start here. `never` reports without failing the build, which is how you find out what the
          # tool says about your site before you decide to gate on it. Move to `blocker`, then `serious`,
          # as you fix what it finds.
          fail-on: never

          # Off by default because submitting a form has side effects on the page under test. Turn it on
          # for pages where "does it tell you what went wrong?" matters — that is 3.3.1 and 4.1.3, and it
          # is invisible to a static scan.
          probe-forms: "false"

      # The report is always in the job summary. Keeping the raw JSON as an artifact is worth it: it has
      # the full transcript, which is the evidence behind every finding.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-witness-result
          path: ${{ steps.witness.outputs.result-json }}
          if-no-files-found: warn

      - name: Show what it found
        if: always()
        shell: bash
        run: |
          echo "findings: ${{ steps.witness.outputs.findings }}"
          echo "task completable: ${{ steps.witness.outputs.task-completable }}"
